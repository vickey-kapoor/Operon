# Dependabot keeps dependencies current with small, reviewed PRs — the
# complement to the pinned uv.lock CI (updates are deliberate + reviewed,
# not silent). Grouped so it opens at most one PR per ecosystem per week.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python dependencies. The `uv` ecosystem updates pyproject.toml AND uv.lock
  # together, so `uv sync --locked` in CI stays consistent after a bump.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Chore"
    groups:
      python-dependencies:
        patterns: ["*"]

  # GitHub Actions pinned in .github/workflows (catches deprecated/outdated
  # action versions — e.g. the Node-20 deprecation warnings seen in CI logs).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI"
    groups:
      github-actions:
        patterns: ["*"]
