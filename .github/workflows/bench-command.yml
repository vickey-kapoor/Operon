name: Bench command

# Runs a live benchmark on a pull request's head when a repository owner, member
# or collaborator comments on it:
#
#   /bench [browser|desktop] [thin|full] [smoke|all] [opus|sonnet|haiku] [check-sonnet|check-haiku]
#
# Defaults: browser, thin harness, smoke suite, Opus 5.5. "all" runs the full
# suite (44 browser tasks or 10 desktop tasks). Claude is the backend on both.
# opus/sonnet/haiku pick the acting Claude model; check-sonnet/check-haiku pick a
# cheaper model for the thin harness's completion check. Reports show the cost.
# Nothing runs on pushes or merges: every run spends model credits, so a run
# happens only when someone asks for one. PRs from forks are refused, since the
# run has the repository's API keys.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  parse:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bench') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.args.outputs.target }}
      profile: ${{ steps.args.outputs.profile }}
      suite: ${{ steps.args.outputs.suite }}
      model: ${{ steps.args.outputs.model }}
      check_model: ${{ steps.args.outputs.check_model }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: args
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -f  # no glob expansion of the comment's words
          target=browser profile=thin suite=smoke model=claude-opus-5-5 check_model=
          # Only the first line is the command; words after it are ignored.
          for word in $(printf '%s\n' "$BODY" | head -n 1 | tr 'A-Z' 'a-z'); do
            case "$word" in
              /bench) ;;
              browser|desktop) target=$word ;;
              thin|full) profile=$word ;;
              smoke) suite=smoke ;;
              all) suite=full ;;
              opus) model=claude-opus-5-5 ;;
              sonnet) model=claude-sonnet-5-5 ;;
              haiku) model=claude-haiku-5-5 ;;
              check-sonnet) check_model=claude-sonnet-5-5 ;;
              check-haiku) check_model=claude-haiku-5-5 ;;
              *) echo "::error::Unknown /bench option '$word'. Use: /bench [browser|desktop] [thin|full] [smoke|all] [opus|sonnet|haiku] [check-sonnet|check-haiku]"; exit 1 ;;
            esac
          done
          echo "target=$target profile=$profile suite=$suite model=$model check_model=$check_model"
          {
            echo "target=$target"; echo "profile=$profile"; echo "suite=$suite"
            echo "model=$model"; echo "check_model=$check_model"
          } >> "$GITHUB_OUTPUT"

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          head_repo=$(gh api "$PR_URL" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Refusing to benchmark a PR from $head_repo: the run has this repository's API keys."
            exit 1
          fi
          echo "sha=$(gh api "$PR_URL" --jq '.head.sha')" >> "$GITHUB_OUTPUT"

  browser:
    needs: parse
    if: needs.parse.outputs.target == 'browser'
    uses: ./.github/workflows/live-bench.yml
    with:
      backends: claude_computer_use
      claude_model: ${{ needs.parse.outputs.model }}
      final_check_model: ${{ needs.parse.outputs.check_model }}
      harness_profile: ${{ needs.parse.outputs.profile }}
      suite: ${{ needs.parse.outputs.suite }}
      ref: ${{ needs.parse.outputs.sha }}
    secrets: inherit

  desktop:
    needs: parse
    if: needs.parse.outputs.target == 'desktop'
    uses: ./.github/workflows/live-desktop-bench.yml
    with:
      desktop_backend: claude_computer_use
      claude_model: ${{ needs.parse.outputs.model }}
      final_check_model: ${{ needs.parse.outputs.check_model }}
      harness_profile: ${{ needs.parse.outputs.profile }}
      suite: ${{ needs.parse.outputs.suite }}
      ref: ${{ needs.parse.outputs.sha }}
    secrets: inherit
