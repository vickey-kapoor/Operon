name: Benchmark from PR comment
run-name: "Benchmark from a comment on PR #${{ github.event.issue.number }}"

# Runs a live benchmark on a pull request's head when a repository owner, member
# or collaborator comments on it:
#
#   /bench [browser|desktop|hybrid] [thin|full] [core|smoke|all|safety|apps|hard|long] [x2|x3|x5] [same-critic] [azure] [season=<n>]
#   /bench grounding
#
# Every run uses Gemini computer use (OPERON_*_BACKEND=computer_use), Operon's only model.
# The first word is the category (KAN-72): browser, desktop or hybrid, each run in
# the thin or full harness, one cell of the 3 x 2 grid. Defaults: browser, full
# harness, the category's core set (evals/categories.py: about 10 state-graded tasks,
# short, long and safety). A thin run ends on Gemini's own "done" (KAN-67).
# hybrid (KAN-73) runs the desktop workflow with a desktop app and the browser in each
# task, on the local site the benchmark serves on the runner itself. "smoke" runs a few
# quick tasks; "all" runs the full suite (44 browser tasks, 20 desktop or 10 hybrid
# tasks); "safety" runs the prompt-injection and overreach tasks (browser, or Desktop
# Safety with desktop); "apps" runs the browser tasks on the local fake shop, mailbox,
# account and forms, graded from the apps' state; "hard" runs the 20-task hard subset
# (evals/hard_tasks.py); "long" runs the 21 multi-app tasks (LONG_TASKS in
# evals/app_tasks.py), or with desktop the long desktop tasks. x2/x3/x5 run every task
# that many times to measure flakiness (the cost cap scales with it). season=<n> runs a
# frozen season's tasks for that suite (--season; evals/seasons/), which is how a grid
# run counts on the dashboard's Leaderboard tab: /bench browser thin season=1.
# "same-critic" makes a full run's step critic the acting model (OPERON_CRITIC=same)
# instead of the verifier model. "grounding" runs the ScreenSpot grounding eval instead
# (one model call per sample, no browser). azure runs a desktop benchmark on our Azure
# VM instead of GitHub's hosted runner. Reports show the cost.
# Nothing runs on pushes or merges: every run spends model credits, so a run
# happens only when someone with write access asks for one. PRs from forks are
# refused, since the run has the repository's API key; only that key (and, for the
# Azure VM, its start/stop credential) is passed on.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  parse:
    name: Read the /bench comment
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bench') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.args.outputs.target }}
      profile: ${{ steps.args.outputs.profile }}
      suite: ${{ steps.args.outputs.suite }}
      runner: ${{ steps.args.outputs.runner }}
      repeat: ${{ steps.args.outputs.repeat }}
      critic: ${{ steps.args.outputs.critic }}
      extra: ${{ steps.args.outputs.extra }}
      label: ${{ steps.args.outputs.label }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: args
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -f  # no glob expansion of the comment's words
          target=browser profile=full suite=core runner=github repeat=1 critic= season=
          # Only the first line is the command; words after it are ignored.
          for word in $(printf '%s\n' "$BODY" | head -n 1 | tr 'A-Z' 'a-z'); do
            case "$word" in
              /bench) ;;
              browser|desktop|hybrid|grounding) target=$word ;;
              thin|full) profile=$word ;;
              core) suite=core ;;
              smoke) suite=smoke ;;
              all) suite=full ;;
              safety) suite=safety ;;
              apps) suite=apps ;;
              hard) suite=hard ;;
              long) suite=long ;;
              x2|x3|x5) repeat=${word#x} ;;
              gemini) ;;  # Operon's only model; accepted so earlier commands still parse
              same-critic) critic=same ;;
              azure) runner=azure ;;
              season=*)
                season=${word#season=}
                if ! printf '%s' "$season" | grep -Eq '^[1-9][0-9]{0,2}$'; then
                  echo "::error::season= needs a season number such as 1."; exit 1
                fi ;;
              *) echo "::error::Unknown /bench option '$word'. Use: /bench [browser|desktop|hybrid] [thin|full] [core|smoke|all|safety|apps|hard|long] [x2|x3|x5] [same-critic] [azure] [season=<n>], or /bench grounding"; exit 1 ;;
            esac
          done
          # Desktop has its own safety and long tasks (KAN-74); apps and hard are browser only.
          # Hybrid runs its core, smoke or full set (its safety and long tasks are inside them).
          if { [ "$suite" = apps ] || [ "$suite" = hard ]; } && [ "$target" = desktop ]; then
            echo "::error::The $suite suite is browser only."; exit 1
          fi
          if { [ "$suite" = safety ] || [ "$suite" = apps ] || [ "$suite" = hard ] || [ "$suite" = long ]; } && [ "$target" = hybrid ]; then
            echo "::error::Hybrid has no $suite suite; use core, smoke or all (its long and safety tasks are in core)."; exit 1
          fi
          if [ -n "$season" ] && [ "$target" = grounding ]; then
            echo "::error::season= is for /bench browser, desktop and hybrid."; exit 1
          fi
          extra=
          [ "$repeat" != 1 ] && extra="--repeat $repeat"
          [ -n "$season" ] && extra="${extra:+$extra }--season $season"
          if [ "$critic" = same ] && [ "$target" = grounding ]; then
            echo "::error::same-critic picks the full harness's step critic; /bench grounding has none."; exit 1
          fi
          if [ "$critic" = same ] && [ "$profile" != full ]; then
            echo "::error::same-critic picks the full harness's step critic; drop thin."; exit 1
          fi
          # The run's name in the Actions list, the way runs are named in chat:
          # "Gemini · Browser · Thin", plus the suite, season and repeats when not the default.
          cap() { printf '%s' "$1" | sed 's/./\U&/'; }
          if [ "$target" = grounding ]; then
            label="Gemini · Grounding"
          else
            label="Gemini · $(cap "$target") · $(cap "$profile")"
            if [ "$suite" != core ]; then label="$label · $suite"; fi
            if [ -n "$season" ]; then label="$label · Season $season"; fi
            if [ "$repeat" != 1 ]; then label="$label · x$repeat"; fi
            if [ "$critic" = same ]; then label="$label · same critic"; fi
            if [ "$runner" = azure ]; then label="$label · Azure VM"; fi
          fi
          echo "target=$target profile=$profile suite=$suite runner=$runner repeat=$repeat critic=$critic extra=$extra label=$label"
          {
            echo "target=$target"; echo "profile=$profile"; echo "suite=$suite"
            echo "runner=$runner"; echo "repeat=$repeat"; echo "critic=$critic"; echo "extra=$extra"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # COLLABORATOR also covers read-only collaborators; only people who can
          # push to the repository may spend its API credits.
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq '.permission' || echo none)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "::error::$COMMENTER has '$permission' access; /bench needs write access."; exit 1 ;;
          esac
          head_repo=$(gh api "$PR_URL" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Refusing to benchmark a PR from $head_repo: the run has this repository's API keys."
            exit 1
          fi
          echo "sha=$(gh api "$PR_URL" --jq '.head.sha')" >> "$GITHUB_OUTPUT"

      # The "Send results to dashboard" workflow reads this after the run to post the results table
      # (score with its 95% range, change vs the previous run, flipped tasks) on the PR.
      - name: Record the pull request
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: mkdir -p pr-request && printf '%s\n' "$PR_NUMBER" > pr-request/number

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-request
          path: pr-request/
          retention-days: 14

  browser:
    name: ${{ needs.parse.outputs.label }}
    needs: parse
    if: needs.parse.outputs.target == 'browser'
    uses: ./.github/workflows/live-bench.yml
    with:
      backends: computer_use
      harness_profile: ${{ needs.parse.outputs.profile }}
      critic: ${{ needs.parse.outputs.critic }}
      suite: ${{ needs.parse.outputs.suite }}
      args: ${{ needs.parse.outputs.extra }}
      ref: ${{ needs.parse.outputs.sha }}
    # Named, not inherited: the benchmarked branch never sees the dashboard,
    # Blob, Slack or Azure secrets.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Desktop and Hybrid both run on the Windows desktop; category picks the tasks.
  desktop:
    name: ${{ needs.parse.outputs.label }}
    needs: parse
    if: needs.parse.outputs.target == 'desktop' || needs.parse.outputs.target == 'hybrid'
    # id-token reaches only the VM start/stop jobs, which ask for it; the bench job
    # (the benchmarked branch's code) stays at contents: read.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/live-desktop-bench.yml
    with:
      runner: ${{ needs.parse.outputs.runner }}
      category: ${{ needs.parse.outputs.target }}
      desktop_backend: computer_use
      harness_profile: ${{ needs.parse.outputs.profile }}
      critic: ${{ needs.parse.outputs.critic }}
      suite: ${{ needs.parse.outputs.suite }}
      args: ${{ needs.parse.outputs.extra }}
      ref: ${{ needs.parse.outputs.sha }}
    # AZURE_CREDENTIALS is used only by the VM start and stop jobs, which run this
    # repository's default-branch workflow code, never the benchmarked branch.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  grounding:
    name: ${{ needs.parse.outputs.label }}
    needs: parse
    if: needs.parse.outputs.target == 'grounding'
    uses: ./.github/workflows/grounding.yml
    with:
      ref: ${{ needs.parse.outputs.sha }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
