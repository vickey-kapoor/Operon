name: Bench command

# Runs a live benchmark on a pull request's head when a repository owner, member
# or collaborator comments on it:
#
#   /bench [browser|desktop] [thin|full] [smoke|all|safety|apps|hard|long] [x2|x3|x5] [opus|sonnet|haiku|gemini] [check-sonnet|check-haiku] [same-critic] [azure] [zoom] [model=<profile>]
#   /bench grounding [opus|sonnet|haiku|gemini] [zoom] [model=<profile>]
#
# model=<profile> runs a model registry profile (evals/models.yaml) through the
# cross-model adapter instead of Claude: the thin harness with the model's own
# "done" unless "full" is given. "same-critic" makes a full run's step critic the
# acting model (OPERON_CRITIC=same) instead of Gemini. It also passes OPENAI_API_KEY, OPENWEIGHT_BASE_URL and
# OPENWEIGHT_API_KEY. Experimental; every run still waits for someone to ask.
#
# Defaults: browser, thin harness, smoke suite, Opus 5.5. "all" runs the full
# suite (44 browser tasks or 10 desktop tasks); "safety" runs the browser
# prompt-injection and overreach tasks; "apps" runs the browser tasks on the local
# fake shop, mailbox, account and forms, graded from the apps' state; "hard" runs the
# 20-task hard subset (evals/hard_tasks.py); "long" runs the 21 multi-app tasks
# (LONG_TASKS in evals/app_tasks.py). x2/x3/x5 run every task that many
# times to measure flakiness (the cost cap scales with it). "grounding" runs the
# ScreenSpot grounding eval instead (one model call per sample, no browser); zoom
# lets Claude zoom into the screenshot (OPERON_CLAUDE_ZOOM). gemini picks Gemini
# computer use (OPERON_*_BACKEND=computer_use) for the browser, desktop or grounding:
# full harness unless thin is given, and a thin Gemini run ends on Gemini's own
# "done" (KAN-67). Claude is the backend otherwise.
# opus/sonnet/haiku pick the acting Claude model; check-sonnet/check-haiku pick a
# cheaper model for the thin harness's completion check. azure runs a desktop
# benchmark on our Azure VM instead of GitHub's hosted runner. Reports show the cost.
# Nothing runs on pushes or merges: every run spends model credits, so a run
# happens only when someone with write access asks for one. PRs from forks are
# refused, since the run has the repository's API keys; only those two keys (and,
# for the Azure VM, its start/stop credential) are passed on.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  parse:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bench') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.args.outputs.target }}
      profile: ${{ steps.args.outputs.profile }}
      suite: ${{ steps.args.outputs.suite }}
      model: ${{ steps.args.outputs.model }}
      check_model: ${{ steps.args.outputs.check_model }}
      runner: ${{ steps.args.outputs.runner }}
      repeat: ${{ steps.args.outputs.repeat }}
      backend: ${{ steps.args.outputs.backend }}
      zoom: ${{ steps.args.outputs.zoom }}
      model_profile: ${{ steps.args.outputs.model_profile }}
      critic: ${{ steps.args.outputs.critic }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: args
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -f  # no glob expansion of the comment's words
          target=browser profile= suite=smoke model=claude-opus-5-5 check_model= runner=github repeat=1 backend=claude_computer_use zoom=false model_profile= critic=
          # Only the first line is the command; words after it are ignored.
          for word in $(printf '%s\n' "$BODY" | head -n 1 | tr 'A-Z' 'a-z'); do
            case "$word" in
              /bench) ;;
              browser|desktop|grounding) target=$word ;;
              thin|full) profile=$word ;;
              smoke) suite=smoke ;;
              all) suite=full ;;
              safety) suite=safety ;;
              apps) suite=apps ;;
              hard) suite=hard ;;
              long) suite=long ;;
              x2|x3|x5) repeat=${word#x} ;;
              gemini) backend=computer_use ;;
              zoom) zoom=true ;;
              opus) model=claude-opus-5-5 ;;
              sonnet) model=claude-sonnet-5-5 ;;
              haiku) model=claude-haiku-5-5 ;;
              check-sonnet) check_model=claude-sonnet-5-5 ;;
              check-haiku) check_model=claude-haiku-5-5 ;;
              same-critic) critic=same ;;
              azure) runner=azure ;;
              model=*)
                model_profile=${word#model=}
                # Profile names are registry keys; nothing else reaches the shell or a path.
                if ! printf '%s' "$model_profile" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,63}$'; then
                  echo "::error::model= needs a registry profile name such as qwen3-vl-32b."; exit 1
                fi ;;
              *) echo "::error::Unknown /bench option '$word'. Use: /bench [browser|desktop] [thin|full] [smoke|all|safety|apps|hard|long] [x2|x3|x5] [opus|sonnet|haiku|gemini] [check-sonnet|check-haiku] [same-critic] [azure] [zoom] [model=<profile>], or /bench grounding [opus|sonnet|haiku|gemini] [zoom] [model=<profile>]"; exit 1 ;;
            esac
          done
          if { [ "$suite" = safety ] || [ "$suite" = apps ] || [ "$suite" = hard ] || [ "$suite" = long ]; } && [ "$target" = desktop ]; then
            echo "::error::The $suite suite is browser only."; exit 1
          fi
          explicit_profile=$profile
          # Each backend's own default harness: thin for Claude, full for Gemini.
          if [ -z "$profile" ]; then
            if [ "$backend" = computer_use ]; then profile=full; else profile=thin; fi
          fi
          if [ "$backend" = computer_use ] && [ -n "$check_model" ]; then
            echo "::error::check-sonnet/check-haiku pick Claude's completion check; a Gemini run has none."; exit 1
          fi
          if [ "$critic" = same ] && [ "$profile" != full ]; then
            echo "::error::same-critic picks the full harness's step critic; add full."; exit 1
          fi
          if [ "$zoom" = true ] && { [ "$target" = browser ] || [ "$backend" = computer_use ]; }; then
            echo "::error::zoom is only an option for /bench desktop and /bench grounding with Claude."; exit 1
          fi
          if [ "$backend" = computer_use ]; then model=; fi  # Gemini's own default model
          if [ -n "$model_profile" ]; then
            if [ "$zoom" = true ] || [ "$backend" = computer_use ]; then
              echo "::error::model= picks the model itself; drop zoom and gemini."; exit 1
            fi
            profile=${explicit_profile:-thin} backend=model
            [ "$target" = grounding ] && model=$model_profile
          fi
          echo "target=$target profile=$profile suite=$suite model=$model check_model=$check_model runner=$runner repeat=$repeat backend=$backend zoom=$zoom model_profile=$model_profile critic=$critic"
          {
            echo "target=$target"; echo "profile=$profile"; echo "suite=$suite"
            echo "model=$model"; echo "check_model=$check_model"; echo "runner=$runner"
            echo "repeat=$repeat"; echo "backend=$backend"; echo "zoom=$zoom"
            echo "model_profile=$model_profile"; echo "critic=$critic"
          } >> "$GITHUB_OUTPUT"

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # COLLABORATOR also covers read-only collaborators; only people who can
          # push to the repository may spend its API credits.
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq '.permission' || echo none)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "::error::$COMMENTER has '$permission' access; /bench needs write access."; exit 1 ;;
          esac
          head_repo=$(gh api "$PR_URL" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Refusing to benchmark a PR from $head_repo: the run has this repository's API keys."
            exit 1
          fi
          echo "sha=$(gh api "$PR_URL" --jq '.head.sha')" >> "$GITHUB_OUTPUT"

  browser:
    needs: parse
    if: needs.parse.outputs.target == 'browser'
    uses: ./.github/workflows/live-bench.yml
    with:
      backends: ${{ needs.parse.outputs.backend }}
      model_profile: ${{ needs.parse.outputs.model_profile }}
      claude_model: ${{ needs.parse.outputs.model }}
      final_check_model: ${{ needs.parse.outputs.check_model }}
      harness_profile: ${{ needs.parse.outputs.profile }}
      critic: ${{ needs.parse.outputs.critic }}
      suite: ${{ needs.parse.outputs.suite }}
      args: ${{ needs.parse.outputs.repeat != '1' && format('--repeat {0}', needs.parse.outputs.repeat) || '' }}
      ref: ${{ needs.parse.outputs.sha }}
    # Named, not inherited: the benchmarked branch never sees the dashboard,
    # Blob, Slack or Azure secrets.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENWEIGHT_BASE_URL: ${{ secrets.OPENWEIGHT_BASE_URL }}
      OPENWEIGHT_API_KEY: ${{ secrets.OPENWEIGHT_API_KEY }}

  desktop:
    needs: parse
    if: needs.parse.outputs.target == 'desktop'
    # id-token reaches only the VM start/stop jobs, which ask for it; the bench job
    # (the benchmarked branch's code) stays at contents: read.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/live-desktop-bench.yml
    with:
      runner: ${{ needs.parse.outputs.runner }}
      desktop_backend: ${{ needs.parse.outputs.backend }}
      model_profile: ${{ needs.parse.outputs.model_profile }}
      claude_model: ${{ needs.parse.outputs.model }}
      final_check_model: ${{ needs.parse.outputs.check_model }}
      harness_profile: ${{ needs.parse.outputs.profile }}
      critic: ${{ needs.parse.outputs.critic }}
      suite: ${{ needs.parse.outputs.suite }}
      zoom: ${{ needs.parse.outputs.zoom == 'true' }}
      args: ${{ needs.parse.outputs.repeat != '1' && format('--repeat {0}', needs.parse.outputs.repeat) || '' }}
      ref: ${{ needs.parse.outputs.sha }}
    # AZURE_CREDENTIALS is used only by the VM start and stop jobs, which run this
    # repository's default-branch workflow code, never the benchmarked branch.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENWEIGHT_BASE_URL: ${{ secrets.OPENWEIGHT_BASE_URL }}
      OPENWEIGHT_API_KEY: ${{ secrets.OPENWEIGHT_API_KEY }}

  grounding:
    needs: parse
    if: needs.parse.outputs.target == 'grounding'
    uses: ./.github/workflows/grounding.yml
    with:
      backend: ${{ needs.parse.outputs.backend }}
      model: ${{ needs.parse.outputs.model }}
      zoom: ${{ needs.parse.outputs.zoom == 'true' }}
      ref: ${{ needs.parse.outputs.sha }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENWEIGHT_BASE_URL: ${{ secrets.OPENWEIGHT_BASE_URL }}
      OPENWEIGHT_API_KEY: ${{ secrets.OPENWEIGHT_API_KEY }}
