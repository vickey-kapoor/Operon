name: Run Operon on test tasks (paid)
run-name: >-
  ${{ github.event_name == 'issue_comment' && format('Paid run · from a comment on PR #{0}', github.event.issue.number)
  || 'Paid run · started by hand' }}

# The one place paid runs start. Every run spends model credits, so nothing runs on a push.
# Paid runs are public benchmarks only (KAN-184): OSWorld and ScreenSpot grounding. Operon's own
# suites (browser, desktop, hybrid) no longer run on paid runs; they stay free (offline evals, replay, e2e tests).
#
# 1. By hand (Actions > Run Operon on test tasks (paid) > Run workflow): give cells to run a batch (KAN-105).
# 2. A comment on a pull request by someone with write access:
#
#   /bench grounding [zoom|zoom=always]   (the ScreenSpot grounding eval on the PR head)
#   /bench batch                          (then one cell per line)
#
# "grounding" runs the ScreenSpot grounding eval (one model call per sample, no browser); with "zoom"
# each click on a dense screen is refined on a zoomed crop (KAN-82). "thin" and "gemini" are accepted
# and change nothing; "full" and "same-critic" are errors (the Full harness was removed, KAN-183).
# /bench with browser, desktop, hybrid or any own-suite word, or with nothing, is an error that says so.
# OSWorld runs the default branch on its own VM, so it is a batch cell or the OSWorld workflow, not a /bench word.
#
# A batch (manual or "/bench batch") is a list of cells, one per line or separated by
# ";" (evals/bench_batch.py):
#
#   grounding zoom per_set=50 pr=242; osworld limit=5 cap=1
#
# grounding cells take zoom, per_set=<n>, pr=<n> (that PR's head; forks refused) or ref=<branch|tag|commit>
# and cap=<USD> (default $3). osworld cells take limit=<0..25>, only=<task id prefix>, steps=<n>,
# model=claude-sonnet-5-5|openai-computer-use (default Gemini; raise cap=, e.g. cap=6, for a 25-task Claude/GPT cell),
# donecheck (KAN-208: OPERON_DONE_CHECK on for that cell) and
# cap=<USD>. Grounding cells run side by side on hosted runners; OSWorld cells run one after another
# on the OSWorld VM (the OSWorld workflow starts and deallocates it). The batch is refused before anything
# starts when the cells' caps add up to more than the batch cap, so the most it can spend is known up front.
#
# The engines it calls (grounding.yml, osworld-bench.yml) are also startable by hand. PRs from forks
# are refused: the run has the repository's API key.

on:
  # guarded: write-access check, fork PRs refused, parser from the default branch
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  workflow_dispatch:
    inputs:
      cells:
        description: "Cells, separated by ';', e.g. grounding zoom pr=242; osworld limit=5 cap=1"
        required: true
      max_total_usd:
        description: "Batch cost cap: refuse the batch if its cells' caps add up to more (0: no cap)"
        default: "10"

permissions:
  contents: read
  pull-requests: read

# One batch at a time: manual and "/bench batch" runs share a group, and the
# OSWorld VM is theirs while they run. Single /bench comments and everything else run freely
# (each OSWorld cell also takes the VM's own concurrency group, azure-osworld-vm, in osworld-bench.yml).
concurrency:
  group: ${{ (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/bench batch')) && 'benchmark-queue' || github.run_id }}
  cancel-in-progress: false

jobs:
  parse:
    name: Read the /bench comment
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bench') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.args.outputs.target }}
      zoom: ${{ steps.args.outputs.zoom }}
      label: ${{ steps.args.outputs.label }}
      cells: ${{ steps.args.outputs.cells }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: args
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -f  # no glob expansion of the comment's words
          # /bench batch: the cells are the comment's other lines, checked by the batch workflow.
          if [ "$(printf '%s\n' "$BODY" | head -n 1 | tr 'A-Z' 'a-z' | sed 's/[[:space:]]*$//')" = "/bench batch" ]; then
            delim="CELLS_$(openssl rand -hex 16)"
            {
              echo "target=batch"; echo "label=Batch"
              echo "cells<<$delim"; printf '%s\n' "$BODY" | tail -n +2 | tr -d '\r'; echo "$delim"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target= zoom=off
          usage="Use: /bench grounding [zoom|zoom=always], or /bench batch with grounding and osworld cells."
          own="Operon's own suites no longer run on paid runs (KAN-184). $usage"
          # Only the first line is the command; words after it are ignored.
          for word in $(printf '%s\n' "$BODY" | head -n 1 | tr 'A-Z' 'a-z'); do
            case "$word" in
              /bench) ;;
              grounding) target=grounding ;;
              thin|gemini) ;;  # the only harness and model; accepted so earlier commands still parse
              full|same-critic) echo "::error::The Full harness was removed (KAN-183); '$word' no longer exists. Runs are thin."; exit 1 ;;
              osworld) echo "::error::OSWorld runs the default branch on its own VM; start it as a batch cell (Actions > this workflow) or with the OSWorld workflow."; exit 1 ;;
              browser|desktop|hybrid|core|smoke|all|safety|apps|hard|long|dynamic|x2|x3|x5|tools|azure|season=*|model=*) echo "::error::$own"; exit 1 ;;
              zoom|zoom=dense) zoom=dense ;;  # KAN-82: OPERON_ZOOM; dense needs a screen side >= 2000 px
              zoom=always) zoom=always ;;
              *) echo "::error::Unknown /bench option '$word'. $usage"; exit 1 ;;
            esac
          done
          if [ "$target" != grounding ]; then
            echo "::error::$usage"; exit 1
          fi
          # The run's name in the Actions list, the way runs are named in chat: "Gemini · Grounding · zoom dense".
          label="Gemini · Grounding"
          if [ "$zoom" != off ]; then label="$label · zoom $zoom"; fi
          echo "target=$target zoom=$zoom label=$label"
          {
            echo "target=$target"; echo "zoom=$zoom"; echo "label=$label"
          } >> "$GITHUB_OUTPUT"

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # COLLABORATOR also covers read-only collaborators; only people who can
          # push to the repository may spend its API credits.
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq '.permission' || echo none)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "::error::$COMMENTER has '$permission' access; /bench needs write access."; exit 1 ;;
          esac
          head_repo=$(gh api "$PR_URL" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Refusing to benchmark a PR from $head_repo: the run has this repository's API keys."
            exit 1
          fi
          echo "sha=$(gh api "$PR_URL" --jq '.head.sha')" >> "$GITHUB_OUTPUT"

      # The "Save run results to dashboard" workflow reads this after the run to post the results table
      # (score with its 95% range, change vs the previous run, flipped tasks) on the PR.
      - name: Record the pull request
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: mkdir -p pr-request && printf '%s\n' "$PR_NUMBER" > pr-request/number

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-request
          path: pr-request/
          retention-days: 14

  # Reads the batch (from a /bench batch comment or the manual cells) and checks every line.
  plan:
    name: Check the run list
    needs: parse
    if: >-
      ${{ !cancelled() && needs.parse.result != 'failure' && (
        (github.event_name == 'issue_comment' && needs.parse.outputs.target == 'batch') ||
        github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      grounding: ${{ steps.read.outputs.grounding }}
      osworld: ${{ steps.read.outputs.osworld }}
      has_grounding: ${{ steps.read.outputs.has_grounding }}
      has_osworld: ${{ steps.read.outputs.has_osworld }}
    steps:
      # The parser always comes from the default branch, never from a benchmarked PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          CELLS: ${{ needs.parse.outputs.cells || inputs.cells }}
          MAX_TOTAL_USD: ${{ inputs.max_total_usd || '10' }}
        run: printf '%s\n' "$CELLS" | python3 -m evals.bench_batch --max-total-usd "$MAX_TOTAL_USD"

  batch-grounding:
    name: ${{ matrix.label }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_grounding == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.grounding) }}
    uses: ./.github/workflows/grounding.yml
    with:
      ref: ${{ matrix.ref }}
      zoom: ${{ matrix.zoom }}
      per_set: ${{ matrix.per_set }}
      max_cost_usd: ${{ matrix.cap }}
      artifact_suffix: ${{ matrix.suffix }}
    # Named, not inherited: the benchmarked code never sees the dashboard, Blob, Slack or Azure secrets.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # OSWorld runs the default branch on its own VM, one cell at a time (max-parallel: 1);
  # osworld-bench.yml starts the VM, runs, and deallocates it.
  batch-osworld:
    name: ${{ matrix.label }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_osworld == 'true' }}
    # The called workflow's publish-videos job asks for contents: write and actions: read (it is skipped here,
    # but a caller must still grant them); its bench job caps itself at contents: read.
    permissions:
      contents: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.osworld) }}
    uses: ./.github/workflows/osworld-bench.yml
    with:
      limit: ${{ matrix.limit }}
      only: ${{ matrix.only }}
      max_cost_usd: ${{ matrix.cap }}
      artifact_suffix: ${{ matrix.suffix }}
      max_steps: ${{ matrix.steps }}
      model: ${{ matrix.model }}
      done_check: ${{ matrix.done_check }}
      publish_videos: "false"  # publish-videos below keeps every cell's videos in one release
    # Only the called workflow's bench job decides which key reaches a cell (by its model).
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Only the osworld cell: the called workflow mints a one-job runner on the VM with it (KAN-195). The benchmarked code never gets it.
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}

  grounding:
    name: ${{ needs.parse.outputs.label }}
    needs: parse
    if: needs.parse.outputs.target == 'grounding'
    uses: ./.github/workflows/grounding.yml
    with:
      ref: ${{ needs.parse.outputs.sha }}
      zoom: ${{ needs.parse.outputs.zoom }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Keeps the run videos for good: workflow artifacts expire after 14 days, a prerelease does not.
  # It only downloads files and uploads them to a release; it never checks out or runs benchmarked code.
  publish-videos:
    name: Keep the run videos
    needs: [batch-osworld]
    # Only when an OSWorld cell ran (grounding makes no videos): skipped jobs must not turn every comment into a successful run
    # (dashboard-data.yml starts on any run that did not conclude 'skipped').
    if: ${{ !cancelled() && (contains(needs.*.result, 'success') || contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      TAG: videos-bench-${{ github.run_id }}-${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # gh itself downloads the artifacts (no third-party action); the files are data, never run.
      - name: Publish a prerelease with the videos
        run: |
          set -eu
          mkdir -p videos upload
          gh run download "$RUN_ID" --pattern 'run-videos-*' --dir videos || echo "No run-videos artifacts."
          n=0
          while IFS= read -r -d '' file; do
            rel="${file#videos/}"
            safe="$(printf '%s' "$rel" | tr -c 'A-Za-z0-9._\n-' '-')"   # artifact folder first, so names stay unique
            cp -- "$file" "upload/$safe"
            n=$((n + 1))
          done < <(find videos -type f -name '*.mp4' -print0)
          if [ "$n" -eq 0 ]; then
            echo "No run videos to keep."
            exit 0
          fi
          gh release create "$TAG" --prerelease --latest=false \
            --title "Run videos bench $RUN_ID (attempt $GITHUB_RUN_ATTEMPT)" \
            --notes "Captioned MP4 per task. Workflow run: $RUN_URL" \
            upload/*.mp4
