name: Run Operon on test tasks (paid)
run-name: >-
  ${{ github.event_name == 'schedule' && 'Benchmark · nightly (2 AM)'
  || github.event_name == 'issue_comment' && format('Benchmark from a comment on PR #{0}', github.event.issue.number)
  || 'Benchmark (manual)' }}

# The one place benchmarks start. Every run spends model credits, so nothing runs on a push.
#
# 1. Nightly, at about 2:25 AM Chicago (KAN-165): the cells queued in evals/nightly-queue.txt
#    that fit tonight's budget, as one batch: at most $10 a night, and nothing once this
#    month's spend (from the dashboard database) reaches $100. If the month's spend can't be
#    read, nothing runs. Lines that already ran are remembered in the "nightly-state" artifact,
#    so a line runs once. Results go to the dashboard and the daily Slack summary.
# 2. By hand (Actions > Run Operon on test tasks (paid) > Run workflow): give cells to run a batch (KAN-105), or leave
#    them empty to print tonight's plan (free; dry_run) or run it (dry_run off).
# 3. A comment on a pull request by someone with write access:
#
#   /bench [browser|desktop|hybrid] [thin|full] [core|smoke|all|safety|apps|hard|long|dynamic] [x2|x3|x5] [same-critic] [tools] [zoom|zoom=always] [azure] [season=<n>]
#   /bench grounding [zoom|zoom=always]
#   /bench batch            (then one cell per line)
#
# Every run uses Gemini computer use, Operon's only model. The first word is the category
# (KAN-72): browser, desktop or hybrid, each in the thin or full harness, one cell of the
# 3 x 2 grid. Defaults: browser, full harness, the category's core set (evals/categories.py).
# A thin run ends on Gemini's own "done" (KAN-67). hybrid (KAN-73) runs a desktop app and the
# browser in each task, on the local site the benchmark serves on the runner itself. "smoke"
# runs a few quick tasks; "all" the full suite; "safety" the prompt-injection and overreach
# tasks; "apps" the browser tasks on the local fake shop, mailbox, account and forms; "hard" the
# 20-task hard subset; "long" the multi-app tasks; "dynamic" the 7 browser tasks on screens
# that move (KAN-114). x2/x3/x5 repeat every task to measure flakiness (the cost cap scales
# with it). season=<n> runs a frozen season's tasks (evals/seasons/), which is how a grid run
# counts on the dashboard's Leaderboard tab. "same-critic" makes a full run's step critic the
# acting model. "grounding" runs the ScreenSpot grounding eval (one model call per sample, no
# browser); with "zoom" each click on a dense screen is refined on a zoomed crop (KAN-82).
# azure runs a desktop benchmark on our Azure VM instead of GitHub's hosted runner.
#
# A batch (nightly, manual or "/bench batch") is a list of cells, one per line or separated by
# ";" (evals/bench_batch.py), in the words above plus pr=<n> (that PR's head; forks refused),
# ref=<branch|tag|commit> and cap=<USD> (default $3):
#
#   browser thin season=2 pr=242; desktop thin season=2 pr=242 cap=1.5; hybrid full
#
# Browser cells run side by side on hosted runners. Desktop and Hybrid cells run one after
# another on one start of the Azure VM, which is deallocated after the last one. The batch is
# refused before anything starts when the cells' caps add up to more than the batch cap, so the
# most it can spend is known up front. Every cell's report goes to the dashboard ("Send results
# to dashboard"); a /bench comment also gets its results table on the PR.
#
# The engines it calls (live-bench.yml, live-desktop-bench.yml, grounding.yml) are also
# startable by hand. PRs from forks are refused: the run has the repository's API key.

on:
  schedule:
    - cron: "23 8 * * *"  # about 2:25 AM Chicago in winter (CST), 3:25 AM in summer (CDT); off the top of the hour, when GitHub delays or drops scheduled runs
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      cells:
        description: "Cells, separated by ';', e.g. browser thin season=2 pr=242; desktop thin season=2 pr=242 cap=1.5. Empty: tonight's queue"
        required: false
        default: ""
      max_total_usd:
        description: "Batch cost cap: refuse the batch if its cells' caps add up to more (0: no cap). Not used for tonight's queue"
        default: "10"
      dry_run:
        description: "Tonight's queue only (cells empty): print the plan, run nothing and mark nothing as run"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

# One queue or batch at a time: nightly, manual and "/bench batch" runs share a group, and the
# Azure VM is theirs while they run. Single /bench comments and everything else run freely
# (each Desktop or Hybrid cell also takes the VM's own concurrency group, azure-desktop-vm).
concurrency:
  group: ${{ (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/bench batch')) && 'benchmark-queue' || github.run_id }}
  cancel-in-progress: false

jobs:
  parse:
    name: Read the /bench comment
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bench') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.args.outputs.target }}
      profile: ${{ steps.args.outputs.profile }}
      suite: ${{ steps.args.outputs.suite }}
      runner: ${{ steps.args.outputs.runner }}
      repeat: ${{ steps.args.outputs.repeat }}
      critic: ${{ steps.args.outputs.critic }}
      tools: ${{ steps.args.outputs.tools }}
      zoom: ${{ steps.args.outputs.zoom }}
      extra: ${{ steps.args.outputs.extra }}
      label: ${{ steps.args.outputs.label }}
      cells: ${{ steps.args.outputs.cells }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: args
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -f  # no glob expansion of the comment's words
          # /bench batch: the cells are the comment's other lines, checked by the batch workflow.
          if [ "$(printf '%s\n' "$BODY" | head -n 1 | tr 'A-Z' 'a-z' | sed 's/[[:space:]]*$//')" = "/bench batch" ]; then
            delim="CELLS_$(openssl rand -hex 16)"
            {
              echo "target=batch"; echo "label=Gemini · Batch"
              echo "cells<<$delim"; printf '%s\n' "$BODY" | tail -n +2 | tr -d '\r'; echo "$delim"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target=browser profile=full suite=core runner=github repeat=1 critic= season= tools=off zoom=off
          # Only the first line is the command; words after it are ignored.
          for word in $(printf '%s\n' "$BODY" | head -n 1 | tr 'A-Z' 'a-z'); do
            case "$word" in
              /bench) ;;
              browser|desktop|hybrid|grounding) target=$word ;;
              thin|full) profile=$word ;;
              core) suite=core ;;
              smoke) suite=smoke ;;
              all) suite=full ;;
              safety) suite=safety ;;
              apps) suite=apps ;;
              hard) suite=hard ;;
              long) suite=long ;;
              dynamic) suite=dynamic ;;  # KAN-114: screens that move (toasts, spinners); browser only
              x2|x3|x5) repeat=${word#x} ;;
              gemini) ;;  # Operon's only model; accepted so earlier commands still parse
              same-critic) critic=same ;;
              tools) tools=all ;;  # RFC 0002: shell, file and HTTP tools next to screen actions
              azure) runner=azure ;;
              zoom|zoom=dense) zoom=dense ;;  # KAN-82: OPERON_ZOOM; dense needs a screen side >= 2000 px
              zoom=always) zoom=always ;;
              season=*)
                season=${word#season=}
                if ! printf '%s' "$season" | grep -Eq '^[1-9][0-9]{0,2}$'; then
                  echo "::error::season= needs a season number such as 1."; exit 1
                fi ;;
              *) echo "::error::Unknown /bench option '$word'. Use: /bench [browser|desktop|hybrid] [thin|full] [core|smoke|all|safety|apps|hard|long|dynamic] [x2|x3|x5] [same-critic] [tools] [zoom|zoom=always] [azure] [season=<n>], or /bench grounding [zoom|zoom=always]"; exit 1 ;;
            esac
          done
          # Desktop has its own safety and long tasks (KAN-74); apps, hard and dynamic are browser only.
          # Hybrid runs its core, smoke or full set (its safety and long tasks are inside them).
          if { [ "$suite" = apps ] || [ "$suite" = hard ] || [ "$suite" = dynamic ]; } && [ "$target" = desktop ]; then
            echo "::error::The $suite suite is browser only."; exit 1
          fi
          if { [ "$suite" = safety ] || [ "$suite" = apps ] || [ "$suite" = hard ] || [ "$suite" = long ] || [ "$suite" = dynamic ]; } && [ "$target" = hybrid ]; then
            echo "::error::Hybrid has no $suite suite; use core, smoke or all (its long and safety tasks are in core)."; exit 1
          fi
          if [ -n "$season" ] && [ "$target" = grounding ]; then
            echo "::error::season= is for /bench browser, desktop and hybrid."; exit 1
          fi
          extra=
          [ "$repeat" != 1 ] && extra="--repeat $repeat"
          [ -n "$season" ] && extra="${extra:+$extra }--season $season"
          if [ "$tools" != off ] && [ "$target" = grounding ]; then
            echo "::error::tools is for /bench browser, desktop and hybrid."; exit 1
          fi
          if [ "$critic" = same ] && [ "$target" = grounding ]; then
            echo "::error::same-critic picks the full harness's step critic; /bench grounding has none."; exit 1
          fi
          if [ "$critic" = same ] && [ "$profile" != full ]; then
            echo "::error::same-critic picks the full harness's step critic; drop thin."; exit 1
          fi
          # The run's name in the Actions list, the way runs are named in chat:
          # "Gemini · Browser · Thin", plus the suite, season and repeats when not the default.
          cap() { printf '%s' "$1" | sed 's/./\U&/'; }
          if [ "$target" = grounding ]; then
            label="Gemini · Grounding"
            if [ "$zoom" != off ]; then label="$label · zoom $zoom"; fi
          else
            label="Gemini · $(cap "$target") · $(cap "$profile")"
            if [ "$suite" != core ]; then label="$label · $suite"; fi
            if [ -n "$season" ]; then label="$label · Season $season"; fi
            if [ "$repeat" != 1 ]; then label="$label · x$repeat"; fi
            if [ "$critic" = same ]; then label="$label · same critic"; fi
            if [ "$tools" != off ]; then label="$label · tools"; fi
            if [ "$zoom" != off ]; then label="$label · zoom $zoom"; fi
            if [ "$runner" = azure ]; then label="$label · Azure VM"; fi
          fi
          echo "target=$target profile=$profile suite=$suite runner=$runner repeat=$repeat critic=$critic tools=$tools zoom=$zoom extra=$extra label=$label"
          {
            echo "target=$target"; echo "profile=$profile"; echo "suite=$suite"
            echo "runner=$runner"; echo "repeat=$repeat"; echo "critic=$critic"; echo "tools=$tools"; echo "zoom=$zoom"; echo "extra=$extra"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"

      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          # COLLABORATOR also covers read-only collaborators; only people who can
          # push to the repository may spend its API credits.
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq '.permission' || echo none)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "::error::$COMMENTER has '$permission' access; /bench needs write access."; exit 1 ;;
          esac
          head_repo=$(gh api "$PR_URL" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Refusing to benchmark a PR from $head_repo: the run has this repository's API keys."
            exit 1
          fi
          echo "sha=$(gh api "$PR_URL" --jq '.head.sha')" >> "$GITHUB_OUTPUT"

      # The "Save run results to dashboard" workflow reads this after the run to post the results table
      # (score with its 95% range, change vs the previous run, flipped tasks) on the PR.
      - name: Record the pull request
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
        run: mkdir -p pr-request && printf '%s\n' "$PR_NUMBER" > pr-request/number

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-request
          path: pr-request/
          retention-days: 14

  # Tonight's cells from evals/nightly-queue.txt, within the nightly budget (KAN-165). Runs on the
  # 2 AM schedule, and by hand when no cells are given.
  queue:
    name: Pick tonight's cells
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cells == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      budget: ${{ steps.plan.outputs.budget }}
      cells: ${{ steps.plan.outputs.cells }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install the Postgres driver
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.9"

      - name: Get the list of lines already run
        # Stops the night (nothing is charged) if the history can't be read: a missing list would run old cells again.
        run: |
          set -euo pipefail
          mkdir -p state
          info=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=nightly-state&per_page=1" --jq '[.total_count, (.artifacts[0].id // "")] | @tsv')
          read -r count id <<< "$info"
          if [ "$count" = "0" ]; then
            echo "No earlier nightly list: this is the first run."
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > state.zip
            unzip -o state.zip -d state
            echo "Using the list from artifact $id."
          fi

      - id: plan
        run: |
          flags=""
          if [ "$DRY_RUN" = "true" ]; then flags="--dry-run"; fi
          python3 -m evals.nightly plan --done state/done.txt $flags

      # Always, so the lines marked as run survive even if the batch below fails (no second charge).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && hashFiles('state/done.txt') != '' }}
        with:
          name: nightly-state
          path: state/done.txt
          retention-days: 90

  # Reads the batch (from a /bench batch comment, the manual cells, or tonight's queue) and checks every line.
  plan:
    name: Read the batch
    needs: [parse, queue]
    if: >-
      ${{ !cancelled() && needs.parse.result != 'failure' && needs.queue.result != 'failure' && (
        (github.event_name == 'issue_comment' && needs.parse.outputs.target == 'batch') ||
        (github.event_name == 'workflow_dispatch' && inputs.cells != '') ||
        needs.queue.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.read.outputs.browser }}
      desktop: ${{ steps.read.outputs.desktop }}
      has_browser: ${{ steps.read.outputs.has_browser }}
      has_desktop: ${{ steps.read.outputs.has_desktop }}
    steps:
      # The parser always comes from the default branch, never from a benchmarked PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
          CELLS: ${{ needs.parse.outputs.cells || inputs.cells || needs.queue.outputs.cells }}
          MAX_TOTAL_USD: ${{ needs.queue.outputs.budget || inputs.max_total_usd || '10' }}
        run: printf '%s\n' "$CELLS" | python3 -m evals.bench_batch --max-total-usd "$MAX_TOTAL_USD"

  start-vm:
    name: Start the Azure VM
    needs: plan
    if: needs.plan.outputs.has_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_VM_RESOURCE_GROUP || 'operon-bench' }}
      VM_NAME: ${{ vars.AZURE_VM_NAME || 'operon-desktop' }}
    steps:
      - name: Check the settings
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] && [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::error::Set repo variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID (or the older AZURE_CREDENTIALS secret). See docs/azure-desktop-runner.md."
            exit 1
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.AZURE_CLIENT_ID == ''
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

  batch-browser:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.has_browser == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser) }}
    uses: ./.github/workflows/live-bench.yml
    with:
      backends: computer_use
      harness_profile: ${{ matrix.profile }}
      critic: ${{ matrix.critic }}
      tools: ${{ matrix.tools }}
      zoom: ${{ matrix.zoom }}
      features: ${{ matrix.features }}
      suite: ${{ matrix.suite }}
      args: ${{ matrix.extra }}
      max_cost_usd: ${{ matrix.cap }}
      artifact_suffix: ${{ matrix.suffix }}
      ref: ${{ matrix.ref }}
    # Named, not inherited: the benchmarked code never sees the dashboard, Blob, Slack or Azure secrets.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  batch-desktop:
    name: ${{ matrix.label }}
    needs: [plan, start-vm]
    if: ${{ !cancelled() && needs.plan.outputs.has_desktop == 'true' && needs.start-vm.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.desktop) }}
    uses: ./.github/workflows/live-desktop-bench.yml
    with:
      runner: azure
      manage_vm: "false"
      category: ${{ matrix.category }}
      desktop_backend: computer_use
      harness_profile: ${{ matrix.profile }}
      critic: ${{ matrix.critic }}
      tools: ${{ matrix.tools }}
      zoom: ${{ matrix.zoom }}
      suite: ${{ matrix.suite }}
      args: ${{ matrix.extra }}
      max_cost_usd: ${{ matrix.cap }}
      artifact_suffix: ${{ matrix.suffix }}
      ref: ${{ matrix.ref }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  stop-vm:
    name: Deallocate the Azure VM
    needs: [start-vm, batch-desktop]
    if: ${{ always() && needs.start-vm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      RESOURCE_GROUP: ${{ vars.AZURE_VM_RESOURCE_GROUP || 'operon-bench' }}
      VM_NAME: ${{ vars.AZURE_VM_NAME || 'operon-desktop' }}
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.AZURE_CLIENT_ID != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.AZURE_CLIENT_ID == ''
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # Deallocated, not just stopped: a stopped VM still bills for compute.
      - run: az vm deallocate --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

  browser:
    name: ${{ needs.parse.outputs.label }}
    needs: parse
    if: needs.parse.outputs.target == 'browser'
    uses: ./.github/workflows/live-bench.yml
    with:
      backends: computer_use
      harness_profile: ${{ needs.parse.outputs.profile }}
      critic: ${{ needs.parse.outputs.critic }}
      tools: ${{ needs.parse.outputs.tools }}
      zoom: ${{ needs.parse.outputs.zoom }}
      suite: ${{ needs.parse.outputs.suite }}
      args: ${{ needs.parse.outputs.extra }}
      ref: ${{ needs.parse.outputs.sha }}
    # Named, not inherited: the benchmarked branch never sees the dashboard,
    # Blob, Slack or Azure secrets.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Desktop and Hybrid both run on the Windows desktop; category picks the tasks.
  desktop:
    name: ${{ needs.parse.outputs.label }}
    needs: parse
    if: needs.parse.outputs.target == 'desktop' || needs.parse.outputs.target == 'hybrid'
    # id-token reaches only the VM start/stop jobs, which ask for it; the bench job
    # (the benchmarked branch's code) stays at contents: read.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/live-desktop-bench.yml
    with:
      runner: ${{ needs.parse.outputs.runner }}
      category: ${{ needs.parse.outputs.target }}
      desktop_backend: computer_use
      harness_profile: ${{ needs.parse.outputs.profile }}
      critic: ${{ needs.parse.outputs.critic }}
      tools: ${{ needs.parse.outputs.tools }}
      zoom: ${{ needs.parse.outputs.zoom }}
      suite: ${{ needs.parse.outputs.suite }}
      args: ${{ needs.parse.outputs.extra }}
      ref: ${{ needs.parse.outputs.sha }}
    # AZURE_CREDENTIALS is used only by the VM start and stop jobs, which run this
    # repository's default-branch workflow code, never the benchmarked branch.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  grounding:
    name: ${{ needs.parse.outputs.label }}
    needs: parse
    if: needs.parse.outputs.target == 'grounding'
    uses: ./.github/workflows/grounding.yml
    with:
      ref: ${{ needs.parse.outputs.sha }}
      zoom: ${{ needs.parse.outputs.zoom }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
