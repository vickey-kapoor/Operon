name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # uv resolves/builds the env for this Python; honored by sync and run.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        # --locked installs precisely what uv.lock pins (and fails if the lock is
        # stale vs pyproject.toml), so CI is reproducible and immune to upstream
        # dependency drift. Update deps deliberately via `uv lock --upgrade`.
        run: uv sync --locked --extra dev

      - name: Run tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPERON_TEST_SAFE_MODE: "true"
        # Live-server suites are auto-deselected by the `live_server` marker
        # (configured via addopts in pyproject.toml).
        run: uv run pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-artifacts
          path: |
            test-results.xml
            .var/runs/
            .var/browser-artifacts/
            .var/test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check src tests --select E,F,W,I --ignore E501

  ui:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Type-check and build
        # tsc runs as part of `npm run build` — the frontend's only automated gate.
        run: npm run build

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Run the dashboard's own tests (no install needed)
        run: npm test
