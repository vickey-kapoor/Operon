name: Tests and lint

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One Python, the minimum Operon supports. The name is a required check on main.
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # uv resolves/builds the env for this Python; honored by sync and run.
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        # --locked installs precisely what uv.lock pins (and fails if the lock is
        # stale vs pyproject.toml), so CI is reproducible and immune to upstream
        # dependency drift. Update deps deliberately via `uv lock --upgrade`.
        run: uv sync --locked --extra dev

      - name: Run tests
        env:
          # The suite is offline: a fake key, so the real one never reaches test code.
          GEMINI_API_KEY: fake-test-key
          OPERON_TEST_SAFE_MODE: "true"
        # Live-server suites are auto-deselected by the `live_server` marker
        # (configured via addopts in pyproject.toml).
        run: uv run pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-artifacts
          path: |
            test-results.xml
            .var/runs/
            .var/browser-artifacts/
            .var/test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check src tests evals --select E,F,W,I --ignore E501
