name: Check code (tests, lint, types)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Least privilege: every job only reads the repo (artifact uploads need no extra scope).
permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One Python, the minimum Operon supports. The name is a required check on main.
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # uv resolves/builds the env for this Python; honored by sync and run.
      UV_PYTHON: "3.14"

    services:
      # The eval-dashboard importer tests (tests/evals/test_dashboard.py) run against a
      # real Postgres; they skip when OPERON_TEST_DATABASE_URL is unset. They create and
      # drop their own tables, so a bare database is enough.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: operon
          POSTGRES_PASSWORD: operon
          POSTGRES_DB: operon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operon -d operon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        # --locked installs precisely what uv.lock pins (and fails if the lock is
        # stale vs pyproject.toml), so CI is reproducible and immune to upstream
        # dependency drift. Update deps deliberately via `uv lock --upgrade`.
        run: uv sync --locked --extra dev --extra dashboard

      - name: Run tests
        env:
          # The suite is offline: a fake key, so the real one never reaches test code.
          GEMINI_API_KEY: fake-test-key
          OPERON_TEST_SAFE_MODE: "true"
          OPERON_TEST_DATABASE_URL: postgresql://operon:operon@localhost:5432/operon_test
        # Live-server suites are auto-deselected by the `live_server` marker
        # (configured via addopts in pyproject.toml).
        # Coverage (KAN-159): line + branch coverage of src/operon, failing under 80%
        # (the total was 85% when the floor was set). The floor lives here, not in
        # pyproject.toml, so local partial runs with --cov do not fail. The table goes to
        # the job summary; coverage.xml is uploaded.
        run: uv run pytest tests/ -v --tb=short --junitxml=test-results.xml --cov --cov-fail-under=80 --cov-report=xml --cov-report=term:skip-covered

      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          {
            echo '## Coverage'
            echo '```'
            uv run coverage report --skip-covered --sort=cover | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-artifacts
          path: |
            test-results.xml
            .var/runs/
            .var/browser-artifacts/
            .var/test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  test-windows:
    # KAN-160: the same offline suite on Windows, where the desktop executor and path
    # handling differ. No Postgres service here: the dashboard importer tests skip when
    # OPERON_TEST_DATABASE_URL is unset. Coverage gating stays on the Linux job.
    name: Test (Windows, Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev --extra dashboard

      - name: Run tests
        env:
          GEMINI_API_KEY: fake-test-key
          OPERON_TEST_SAFE_MODE: "true"
        run: uv run pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-windows
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    # KAN-166: the real loop clicks and types on a real XFCE desktop (the KAN-80 Linux
    # desktop container) with a scripted model instead of Gemini, so it costs nothing.
    # Graded from the machine's own state; tests/desktop_e2e.
    name: Desktop (Linux container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run the desktop tests (builds the desktop image first, a few minutes)
        env:
          GEMINI_API_KEY: fake-test-key
          OPERON_E2E_REQUIRE_DESKTOP: "true"
        run: uv run pytest tests/desktop_e2e -m desktop_container -o addopts="" -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check src tests evals --select E,F,W,I --ignore E501

  typecheck:
    # KAN-159. mypy over src/operon; settings and the starting baseline (modules
    # still allowed to have errors) are in [tool.mypy] in pyproject.toml.
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run mypy
