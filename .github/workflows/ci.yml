name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      # uv resolves/builds the env for this Python; honored by sync and run.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        # --locked installs precisely what uv.lock pins (and fails if the lock is
        # stale vs pyproject.toml), so CI is reproducible and immune to upstream
        # dependency drift. Update deps deliberately via `uv lock --upgrade`.
        run: uv sync --locked --extra dev

      - name: Run tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPERON_TEST_SAFE_MODE: "true"
        # Live-server suites are auto-deselected by the `live_server` marker
        # (configured via addopts in pyproject.toml).
        run: uv run pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-results.xml
            runs/
            .browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check src tests --select E,F,W,I --ignore E501
