name: Check code (tests, lint, types)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  # KAN-228: merges made by the PR gate use GITHUB_TOKEN, which does not start push CI, so the free jobs also
  # run on main every night (02:23 UTC = 8:23 PM Chicago, before the 9:47 PM daily note). The PR gate sweep now also
  # starts this workflow on main after each merge (KAN-283); the nightly stays as a backup.
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

# Least privilege: every job only reads the repo (artifact uploads need no extra scope).
permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'nightly-dispatch' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # One Python, the minimum Operon supports. The name is a required check on main.
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # uv resolves/builds the env for this Python; honored by sync and run.
      UV_PYTHON: "3.14"

    services:
      # The eval-dashboard importer tests (tests/evals/test_dashboard.py) run against a
      # real Postgres; they skip when OPERON_TEST_DATABASE_URL is unset. They create and
      # drop their own tables, so a bare database is enough.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: operon
          POSTGRES_PASSWORD: operon
          POSTGRES_DB: operon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operon -d operon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        # --locked installs precisely what uv.lock pins (and fails if the lock is
        # stale vs pyproject.toml), so CI is reproducible and immune to upstream
        # dependency drift. Update deps deliberately via `uv lock --upgrade`.
        run: uv sync --locked --extra dev --extra dashboard

      - name: Run tests
        env:
          # The suite is offline: a fake key, so the real one never reaches test code.
          GEMINI_API_KEY: fake-test-key
          OPERON_TEST_SAFE_MODE: "true"
          OPERON_TEST_DATABASE_URL: postgresql://operon:operon@localhost:5432/operon_test
        # Live-server suites are auto-deselected by the `live_server` marker
        # (configured via addopts in pyproject.toml).
        # Coverage (KAN-159): line + branch coverage of src/operon, failing under 80%
        # (the total was 85% when the floor was set). The floor lives here, not in
        # pyproject.toml, so local partial runs with --cov do not fail. The table goes to
        # the job summary; coverage.xml is uploaded.
        run: uv run pytest tests/ -v --tb=short --junitxml=test-results.xml --cov --cov-fail-under=80 --cov-report=xml --cov-report=term:skip-covered

      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          {
            echo '## Coverage'
            echo '```'
            uv run coverage report --skip-covered --sort=cover | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-artifacts
          path: |
            test-results.xml
            .var/runs/
            .var/browser-artifacts/
            .var/test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  test-windows:
    # KAN-160: the same offline suite on Windows, where the desktop executor and path
    # handling differ. No Postgres service here: the dashboard importer tests skip when
    # OPERON_TEST_DATABASE_URL is unset. Coverage gating stays on the Linux job.
    name: Test (Windows, Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev --extra dashboard

      - name: Run tests
        env:
          GEMINI_API_KEY: fake-test-key
          OPERON_TEST_SAFE_MODE: "true"
        run: uv run pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-windows
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    # KAN-166: the real loop clicks and types on a real XFCE desktop (the KAN-80 Linux
    # desktop container) with a scripted model instead of Gemini, so it costs nothing.
    # Graded from the machine's own state; tests/desktop_e2e. Every run uploads its evidence
    # (screenshots, run.jsonl, state.json) as the desktop-e2e-evidence artifact, pass or fail.
    name: Desktop (Linux container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run the desktop tests (builds the desktop image first, a few minutes)
        env:
          GEMINI_API_KEY: fake-test-key
          OPERON_E2E_REQUIRE_DESKTOP: "true"
          OPERON_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        run: uv run pytest tests/desktop_e2e -m desktop_container -o addopts="" -v --tb=short

      - name: Upload the run evidence (screenshots, run.jsonl, state.json)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-e2e-evidence
          path: ${{ runner.temp }}/e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run ruff check src tests evals --select E,F,W,I --ignore E501

  terraform:
    # KAN-224: the OSWorld runner's Google Cloud setup. Formatting and a validate of both roots; no
    # backend and no credentials, so nothing here reads or changes the real project.
    name: Terraform (infra/gcp)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate the state bucket bootstrap
        run: |
          terraform -chdir=infra/gcp/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/gcp/bootstrap validate

      - name: Validate the runner VM setup
        run: |
          terraform -chdir=infra/gcp init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/gcp validate

  typecheck:
    # KAN-159. mypy over src/operon; settings and the starting baseline (modules
    # still allowed to have errors) are in [tool.mypy] in pyproject.toml.
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run mypy

  browser-e2e:
    # The real loop drives the real NativeBrowserExecutor on headless Chromium against a
    # local fixture site, with a scripted model instead of Gemini, so it costs nothing.
    # tests/browser_e2e. OPERON_E2E_REQUIRE_BROWSER makes a missing Chromium fail, not skip.
    # Every run uploads its evidence (screenshots, run.jsonl, state.json) as the
    # browser-e2e-evidence artifact, pass or fail.
    name: Browser end to end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Install Chromium and its system libraries
        run: uv run playwright install --with-deps chromium

      - name: Run the browser end-to-end tests
        env:
          GEMINI_API_KEY: fake-test-key
          OPERON_E2E_REQUIRE_BROWSER: "true"
          OPERON_E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts
        run: uv run pytest tests/browser_e2e -m browser_e2e -o addopts="" -v --tb=short

      - name: Upload the run evidence (screenshots, run.jsonl, state.json)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-e2e-evidence
          path: ${{ runner.temp }}/e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7

  evals:
    # The scripted eval scenarios through the real loop, offline. `python -m evals` exits 1
    # on a false success, a crash, or a miss that is not a labelled known issue (today one:
    # cu_relaunch_runaway, RFC 0003), and 0 otherwise.
    name: Scripted evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (packages cached between runs, keyed on uv.lock)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run the scripted evals
        env:
          GEMINI_API_KEY: fake-test-key
        run: uv run python -m evals

  nightly-report:
    # KAN-228: only on the nightly run. Opens (or comments on) one issue when a job failed, closes it when all pass.
    name: Nightly report
    needs: [test, test-windows, desktop, lint, terraform, typecheck, browser-e2e, evals]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Open, update or close the nightly-failure issue
        run: |
          set -euo pipefail
          gh label create nightly-failure --repo "$REPO" --color B60205 --description "The nightly tests on main failed (KAN-228)" --force
          open_issues=$(gh issue list --repo "$REPO" --label nightly-failure --state open --limit 100 --json number --jq '.[].number')
          existing=$(printf '%s\n' "$open_issues" | head -n 1)
          failed=no
          for r in $RESULTS; do
            [ "$r" = success ] || failed=yes
          done
          printf 'Run: %s\n' "$RUN_URL" > body.md
          if [ "$failed" = yes ]; then
            printf '\nJob results: %s\n' "$RESULTS" >> body.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body-file body.md
            else
              gh issue create --repo "$REPO" --title "Nightly tests failed on main" --label nightly-failure --body-file body.md
            fi
          else
            printf 'The nightly tests passed again.\n\n' | cat - body.md > comment.md
            for n in $open_issues; do
              gh issue close "$n" --repo "$REPO" --comment "$(cat comment.md)"
            done
          fi
