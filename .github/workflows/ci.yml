name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPERON_TEST_SAFE_MODE: "true"
        # Live-server suites are auto-deselected by the `live_server` marker
        # (configured via addopts in pyproject.toml).
        run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-results.xml
            runs/
            .browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install linting tools
        # Use the dev extra so ruff is pinned to the same range as pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run ruff
        run: ruff check src tests --select E,F,W,I --ignore E501

  rust-check:
    name: Rust (cargo check)
    runs-on: ubuntu-latest
    # Only run when Tauri source files change — skip on Python-only PRs.
    # Remove the paths filter if you want it to run on every push.

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create stub sidecar binary for cargo check
        # Tauri's build.rs validates that externalBin paths exist at check time.
        # The real binary is built by scripts/bundle_sidecar.py — not committed.
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/operon-api-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/operon-api-x86_64-unknown-linux-gnu

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
