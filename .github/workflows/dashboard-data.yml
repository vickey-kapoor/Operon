name: Dashboard data

# After a live benchmark finishes, write its reports to the eval dashboard's
# Postgres database (Neon, connected to the operon-evals Vercel project); the
# dashboard reads it through its API routes. Reports carry task names, outcomes,
# cost and the judge's one-line reasons. Screenshots and traces of a finished run
# go to Vercel Blob (BLOB_READ_WRITE_TOKEN secret) and the database keeps their
# links; a Slack alert (SLACK_WEBHOOK_URL secret) goes out when a run's pass rate
# or cost per task got worse than the previous comparable run, or it hit its cost cap.
# Both secrets are optional: without them the results are imported on their own.
#
# Run it by hand to import an older workflow run (run_ids, while its artifacts
# last, 14 days) or reports committed at a git ref (backfill_ref; the default is
# the last commit that kept them in dashboard/data/reports).

on:
  workflow_run:
    workflows: ["Live benchmark", "Live desktop benchmark", "Bench command"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Benchmark workflow run ids to import, space-separated"
        required: false
        default: ""
      backfill_ref:
        description: "Also import dashboard/data/reports from this git ref (empty to skip)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check the database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the dashboard database's connection string as the DATABASE_URL repository secret."
            exit 1
          fi

      - name: Install the Postgres driver
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.9"

      - name: Install the Vercel Blob client
        if: env.BLOB_READ_WRITE_TOKEN != ''
        run: npm ci --prefix dashboard --no-audit --no-fund

      - name: Import the finished benchmark run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          # A /bench comment runs on the default branch's workflow but benchmarks the
          # PR's head, so its head_sha is not the commit that was measured.
          GIT_SHA: ${{ github.event.workflow_run.event != 'issue_comment' && github.event.workflow_run.head_sha || '' }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'bench-*' --dir "artifacts/$RUN_ID" || true
          if [ ! -d "artifacts/$RUN_ID" ]; then echo "No benchmark artifacts in this run."; exit 0; fi
          python3 -m tests.eval.dashboard import "artifacts/$RUN_ID" --run-url "$RUN_URL" --git-sha "$GIT_SHA" --blob --alert

      - name: Import the requested runs
        if: github.event_name == 'workflow_dispatch' && inputs.run_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          for run_id in $RUN_IDS; do
            read -r run_url event head_sha < <(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json url,event,headSha --jq '[.url, .event, .headSha] | @tsv')
            [ "$event" = "issue_comment" ] && head_sha=""
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'bench-*' --dir "artifacts/$run_id"
            python3 -m tests.eval.dashboard import "artifacts/$run_id" --run-url "$run_url" --git-sha "$head_sha" --blob
          done

      - name: Import committed reports
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_ref != ''
        env:
          REF: ${{ inputs.backfill_ref }}
        run: |
          # The checkout is shallow, so fetch the ref (a commit, branch or tag) first.
          git fetch --quiet --depth=1 origin "$REF"
          mkdir -p backfill
          git archive FETCH_HEAD dashboard/data/reports | tar -x -C backfill
          python3 -m tests.eval.dashboard import backfill/dashboard/data/reports
