name: Grounding eval

# Runs the ScreenSpot grounding eval (evals/grounding.py): one model call per
# sample through Operon's Gemini computer-use backend, scored hit or miss against the
# target's box. No browser and no API server. Manual only: every run spends model
# credits. Stops once it has spent max_cost_usd (MAX_RUN_COST_USD).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model (empty: gemini-3.5-flash)"
        default: ""
      per_set:
        description: "Samples per set (v2-desktop, v2-web, pro)"
        default: "100"
      max_cost_usd:
        description: "Stop once the run has spent this many USD (0: no cap)"
        default: "5"
  # Called by bench-command.yml for /bench grounding.
  workflow_call:
    inputs:
      model: {type: string, default: ""}
      per_set: {type: string, default: "100"}
      max_cost_usd: {type: string, default: "5"}
      ref:
        description: "Git ref to evaluate (empty: the triggering ref)"
        type: string
        default: ""
    secrets:
      GEMINI_API_KEY: {required: false}

permissions:
  contents: read

jobs:
  grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.14"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MAX_RUN_COST_USD: ${{ inputs.max_cost_usd }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing repository secret GEMINI_API_KEY."; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Run the grounding eval
        env:
          MODEL: ${{ inputs.model }}
          PER_SET: ${{ inputs.per_set }}
        run: |
          set -o pipefail
          uv run python -m evals.grounding --per-set "$PER_SET" ${MODEL:+--model "$MODEL"} | tee grounding.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Grounding"
            echo '```'
            tail -n 25 grounding.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Not bench-*: the Dashboard data workflow imports those as benchmark runs.
          name: grounding-computer_use
          path: |
            grounding.txt
            .var/bench/grounding-*.json
          if-no-files-found: ignore
          retention-days: 14
