name: Check API key

# Confirms the Gemini API key in repo secrets is accepted, by listing models.
# Listing models is free: no tokens are generated. Prints only HTTP status codes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/key-check.yml

permissions:
  contents: read

jobs:
  check:
    name: Check the Gemini API key
    # Secrets are not passed to pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check keys
        run: |
          fail=0
          check() {
            name="$1"; shift
            # A network error makes curl exit nonzero; record it as 000 instead of stopping the step.
            code=$(curl -s -o /dev/null -w '%{http_code}' "$@") || code="000"
            if [ "$code" = "200" ]; then
              echo "OK   $name (HTTP $code)"
            else
              echo "FAIL $name (HTTP $code)"; fail=1
            fi
          }
          if [ -z "$GEMINI_API_KEY" ]; then echo "MISSING GEMINI_API_KEY"; fail=1; else
            check GEMINI_API_KEY https://generativelanguage.googleapis.com/v1beta/models -H "x-goog-api-key: $GEMINI_API_KEY"; fi
          exit $fail
