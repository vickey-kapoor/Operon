name: Live benchmark

# Runs the live web benchmark (tests/eval/live_bench.py) against a real API
# server and real websites. Manual only: every run spends model credits.
# Needs repo secrets GEMINI_API_KEY (always: the judge and critic are Gemini)
# and ANTHROPIC_API_KEY (for the claude_computer_use backend).
# Each backend's run stops once it has spent max_cost_usd (MAX_RUN_COST_USD).

on:
  workflow_dispatch:
    inputs:
      backends:
        description: "Browser backends to compare, space-separated"
        default: "computer_use claude_computer_use"
      claude_model:
        description: "Model for claude_computer_use"
        default: "claude-opus-5-5"
      claude_effort:
        description: "Effort for claude_computer_use (low, medium, high)"
        default: "low"
      harness_profile:
        description: "OPERON_HARNESS_PROFILE for Claude: thin (default) or full. Gemini always runs full."
        type: choice
        options: [thin, full]
        default: thin
      final_check_model:
        description: "OPERON_FINAL_CHECK_MODEL for the thin harness (empty: the acting Claude model)"
        default: ""
      suite:
        description: "smoke (5 tasks), full (44 tasks), or safety (9 prompt-injection and overreach tasks on a local site)"
        type: choice
        options: [full, smoke, safety]
        default: full
      args:
        description: "Extra live_bench arguments, e.g. --category forms --only slider"
        default: ""
      max_cost_usd:
        description: "Stop a backend's run once it has spent this many USD (0: no cap)"
        default: "5"
  # Called by bench-command.yml when someone comments /bench on a PR.
  workflow_call:
    inputs:
      backends: {type: string, default: "claude_computer_use"}
      claude_model: {type: string, default: "claude-opus-5-5"}
      claude_effort: {type: string, default: "low"}
      harness_profile: {type: string, default: "thin"}
      final_check_model: {type: string, default: ""}
      suite: {type: string, default: "smoke"}
      args: {type: string, default: ""}
      max_cost_usd: {type: string, default: "5"}
      ref:
        description: "Git ref to benchmark (empty: the triggering ref)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backends: ${{ steps.split.outputs.backends }}
    steps:
      - id: split
        env:
          BACKENDS: ${{ inputs.backends }}
        run: echo "backends=$(jq -cn --arg b "$BACKENDS" '$b | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: Bench (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.plan.outputs.backends) }}
    env:
      UV_PYTHON: "3.14"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPERON_BROWSER_BACKEND: ${{ matrix.backend }}
      OPERON_BROWSER_CLAUDE_MODEL: ${{ inputs.claude_model }}
      OPERON_BROWSER_CLAUDE_EFFORT: ${{ inputs.claude_effort }}
      OPERON_HARNESS_PROFILE: ${{ inputs.harness_profile }}
      OPERON_FINAL_CHECK_MODEL: ${{ inputs.final_check_model }}
      MAX_RUN_COST_USD: ${{ inputs.max_cost_usd }}
      BROWSER_HEADLESS: "true"
    steps:
      - name: Check the secrets
        run: |
          missing=""
          [ -n "$GEMINI_API_KEY" ] || missing="$missing GEMINI_API_KEY"
          if [ "$OPERON_BROWSER_BACKEND" = "claude_computer_use" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            missing="$missing ANTHROPIC_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Start the API
        run: |
          nohup uv run python -m uvicorn operon.api.server:app --host 127.0.0.1 --port 8080 > uvicorn.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && exit 0
            sleep 2
          done
          cat uvicorn.log
          exit 1

      - name: Run the benchmark
        env:
          SUITE: ${{ inputs.suite }}
          EXTRA_ARGS: ${{ inputs.args }}
        # EXTRA_ARGS is left unquoted on purpose: it is a list of arguments.
        # --keep-screens saves the screenshots the dashboard shows; pipefail keeps the cost-cap exit.
        run: |
          set -o pipefail
          uv run python -m tests.eval.live_bench --suite "$SUITE" --keep-screens $EXTRA_ARGS | tee bench.txt

      - name: Summary
        if: always()
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          {
            echo "## $BACKEND"
            echo '```'
            tail -n 60 bench.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.backend }}
          path: |
            bench.txt
            uvicorn.log
            .var/bench/
          if-no-files-found: ignore
          retention-days: 14
