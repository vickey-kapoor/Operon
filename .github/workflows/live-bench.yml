name: Browser benchmark
run-name: Gemini · Browser · ${{ inputs.harness_profile }} · ${{ inputs.suite }} (manual)

# Runs the live web benchmark (evals/live_bench.py) against a real API
# server and real websites. Manual only: every run spends model credits.
# Needs the repo secret GEMINI_API_KEY: Gemini is the agent, the critic and the judge.
# Each backend's run stops once it has spent max_cost_usd (MAX_RUN_COST_USD).

on:
  workflow_dispatch:
    inputs:
      backends:
        description: "Browser backends to compare, space-separated: computer_use (Gemini computer use) and/or json (Gemini JSON)"
        default: "computer_use"
      harness_profile:
        description: "OPERON_HARNESS_PROFILE: thin or full, for Gemini computer use (thin ends on the model's own done)."
        type: choice
        options: [thin, full]
        default: full
      critic:
        description: "OPERON_CRITIC for the full harness: empty = the Gemini verifier, same = the acting model judges each step"
        default: ""
      suite:
        description: "core (the Browser category's 10 state-graded tasks: 5 short, 2 long, 3 safety; evals/categories.py), smoke (5 tasks), full (44 tasks), safety (9 prompt-injection and overreach tasks on a local site), apps (11 tasks on local fake apps, graded from their state), hard (20 harder tasks from those suites and the full one, meant for --repeat 3), or long (21 multi-app tasks on the local apps, 20 to 50 steps each)"
        type: choice
        options: [core, full, smoke, safety, apps, hard, long]
        default: core
      args:
        description: "Extra live_bench arguments, e.g. --category forms --only slider, or --repeat 3"
        default: ""
      max_cost_usd:
        description: "Stop a backend's run once it has spent this many USD (0: no cap)"
        default: "3"
  # Called by bench-command.yml when someone comments /bench on a PR.
  workflow_call:
    inputs:
      backends: {type: string, default: "computer_use"}
      harness_profile: {type: string, default: "full"}
      critic: {type: string, default: ""}
      suite: {type: string, default: "core"}
      args: {type: string, default: ""}
      max_cost_usd: {type: string, default: "3"}
      # Set by the batch workflow (bench-batch.yml) so its cells' artifacts don't share a name.
      artifact_suffix: {type: string, default: ""}
      ref:
        description: "Git ref to benchmark (empty: the triggering ref)"
        type: string
        default: ""
    # Only these secrets reach a /bench run; the caller passes them by name.
    secrets:
      GEMINI_API_KEY: {required: false}

permissions:
  contents: read

jobs:
  plan:
    name: Pick the backends
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backends: ${{ steps.split.outputs.backends }}
    steps:
      - id: split
        env:
          BACKENDS: ${{ inputs.backends }}
        run: echo "backends=$(jq -cn --arg b "$BACKENDS" '$b | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ matrix.backend == 'computer_use' && 'Run the tasks' || format('Run the tasks ({0} backend)', matrix.backend) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.plan.outputs.backends) }}
    env:
      UV_PYTHON: "3.14"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPERON_BROWSER_BACKEND: ${{ matrix.backend }}
      OPERON_HARNESS_PROFILE: ${{ inputs.harness_profile }}
      OPERON_CRITIC: ${{ inputs.critic }}
      MAX_RUN_COST_USD: ${{ inputs.max_cost_usd }}
      # The trust gate is on by default (KAN-15); benchmarks keep it off so scores stay comparable.
      OPERON_TRUST_GATE: "off"
      BROWSER_HEADLESS: "true"
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing repository secret GEMINI_API_KEY. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          # The benchmarked code (possibly a PR branch) needs no git token.
          persist-credentials: false

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Load the held-out season tasks
        # Only --season runs use them; the file never lands in the repo or the artifacts.
        env:
          SEASON_PRIVATE_PY: ${{ secrets.OPERON_SEASON_PRIVATE_PY }}
        run: |
          if [ -n "$SEASON_PRIVATE_PY" ]; then
            printf '%s' "$SEASON_PRIVATE_PY" | base64 -d > "$RUNNER_TEMP/season-private.py"
            echo "OPERON_SEASON_PRIVATE=$RUNNER_TEMP/season-private.py" >> "$GITHUB_ENV"
          fi

      - name: Start the API
        run: |
          nohup uv run python -m uvicorn operon.api.server:app --host 127.0.0.1 --port 8080 > uvicorn.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && exit 0
            sleep 2
          done
          cat uvicorn.log
          exit 1

      - name: Run the benchmark
        env:
          SUITE: ${{ inputs.suite }}
          EXTRA_ARGS: ${{ inputs.args }}
        # EXTRA_ARGS is left unquoted on purpose: it is a list of arguments.
        # --keep-screens saves the screenshots the dashboard shows; pipefail keeps the cost-cap exit.
        run: |
          set -o pipefail
          uv run python -m evals.live_bench --suite "$SUITE" --keep-screens $EXTRA_ARGS | tee bench.txt

      - name: Summary
        if: always()
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          {
            echo "## $BACKEND"
            echo '```'
            tail -n 60 bench.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-${{ matrix.backend }}${{ inputs.artifact_suffix }}
          path: |
            bench.txt
            uvicorn.log
            .var/bench/
          if-no-files-found: ignore
          retention-days: 14
