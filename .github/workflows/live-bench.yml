# No longer started by any paid entry point (KAN-184); kept until the cleanup PR.
name: Run browser test tasks (engine)
run-name: Gemini · Browser · Thin · ${{ inputs.suite }} (manual)

# Runs the live web benchmark (evals/live_bench.py) against a real API
# server and real websites. Every run spends model credits.
# Needs the repo secret GEMINI_API_KEY: Gemini is the agent and the judge.
# Each backend's run stops once it has spent max_cost_usd (MAX_RUN_COST_USD).

on:
  # Only called now (no manual trigger left; KAN-184).
  workflow_call:
    inputs:
      backends: {type: string, default: "computer_use"}
      tools: {type: string, default: "off"}
      zoom: {type: string, default: "off"}
      gemini_safety: {type: string, default: "default"}
      features: {type: string, default: ""}
      model: {type: string, default: ""}
      suite: {type: string, default: "core"}
      args: {type: string, default: ""}
      max_cost_usd: {type: string, default: "3"}
      # Set by the paid-run workflow (benchmark.yml) so its cells' artifacts don't share a name.
      artifact_suffix: {type: string, default: ""}
      ref:
        description: "Git ref to benchmark (empty: the triggering ref)"
        type: string
        default: ""
    # Only these secrets reach a /bench run; the caller passes them by name.
    secrets:
      GEMINI_API_KEY: {required: false}
      ANTHROPIC_API_KEY: {required: false}
      OPENAI_API_KEY: {required: false}

permissions:
  contents: read

jobs:
  plan:
    name: Pick the models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backends: ${{ steps.split.outputs.backends }}
    steps:
      - id: split
        env:
          BACKENDS: ${{ inputs.backends }}
        run: echo "backends=$(jq -cn --arg b "$BACKENDS" '$b | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ matrix.backend == 'computer_use' && 'Run the tasks' || format('Run the tasks ({0} backend)', matrix.backend) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.plan.outputs.backends) }}
    env:
      UV_PYTHON: "3.14"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPERON_BROWSER_BACKEND: ${{ inputs.model && 'model' || matrix.backend }}
      # Kept so benchmarks of revisions older than fc3d0ff, which default Gemini computer use to the
      # Full harness, still run thin (KAN-183). Current code ignores it.
      OPERON_HARNESS_PROFILE: thin
      # A registry model (KAN-168) acts through the model backend, always thin with its own done.
      OPERON_MODEL_PROFILE: ${{ inputs.model }}
      # Another provider's key reaches a cell only when that cell runs that provider's model.
      ANTHROPIC_API_KEY: ${{ startsWith(inputs.model, 'claude') && secrets.ANTHROPIC_API_KEY || '' }}
      OPENAI_API_KEY: ${{ startsWith(inputs.model, 'openai') && secrets.OPENAI_API_KEY || '' }}
      # Tools next to screen actions (RFC 0002); off unless the run asks for them.
      OPERON_TOOLS: ${{ inputs.tools || 'off' }}
      # Zoom before clicking (KAN-82); off unless the run asks for it.
      OPERON_ZOOM: ${{ inputs.zoom || 'off' }}
      # Gemini's content filter; default sends no safetySettings.
      OPERON_GEMINI_SAFETY: ${{ inputs.gemini_safety || 'default' }}
      # Perception experiments (KAN-115); each is off unless the run names it.
      OPERON_SETTLE_DETECT: ${{ contains(inputs.features, 'settle') && 'on' || 'off' }}
      OPERON_CHANGE_NOTE: ${{ contains(inputs.features, 'note') && 'on' || 'off' }}
      OPERON_PLANNER: ${{ contains(inputs.features, 'planner') && 'on' || 'off' }}
      OPERON_EXPECT_CHECK: ${{ contains(inputs.features, 'expect') && 'on' || 'off' }}
      MAX_RUN_COST_USD: ${{ inputs.max_cost_usd }}
      # The trust gate is on by default (KAN-15); benchmarks keep it off so scores stay comparable.
      OPERON_TRUST_GATE: "off"
      BROWSER_HEADLESS: "true"
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing repository secret GEMINI_API_KEY. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          # The benchmarked code (possibly a PR branch) needs no git token.
          persist-credentials: false

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Load the held-out season tasks
        # Only --season runs use them; the file never lands in the repo or the artifacts.
        env:
          SEASON_PRIVATE_PY: ${{ secrets.OPERON_SEASON_PRIVATE_PY }}
        run: |
          if [ -n "$SEASON_PRIVATE_PY" ]; then
            printf '%s' "$SEASON_PRIVATE_PY" | base64 -d > "$RUNNER_TEMP/season-private.py"
            echo "OPERON_SEASON_PRIVATE=$RUNNER_TEMP/season-private.py" >> "$GITHUB_ENV"
          fi

      - name: Start the API
        run: |
          if [ "${OPERON_TOOLS:-off}" != off ]; then
            # The file tools may use ~/Documents; the file guard pauses on any other path.
            mkdir -p "$HOME/Documents"
            export OPERON_ALLOWED_FILE_ROOTS="$HOME/Documents"
          fi
          nohup uv run python -m uvicorn operon.api.server:app --host 127.0.0.1 --port 8080 > uvicorn.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health > /dev/null && exit 0
            sleep 2
          done
          cat uvicorn.log
          exit 1

      - name: Run the tasks
        env:
          SUITE: ${{ inputs.suite }}
          EXTRA_ARGS: ${{ inputs.args }}
        # EXTRA_ARGS is left unquoted on purpose: it is a list of arguments.
        # --keep-screens saves the screenshots the dashboard shows; pipefail keeps the cost-cap exit.
        run: |
          set -o pipefail
          uv run python -m evals.live_bench --suite "$SUITE" --keep-screens --videos $EXTRA_ARGS | tee bench.txt

      - name: Summary
        if: always()
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          {
            echo "## $BACKEND"
            echo '```'
            tail -n 60 bench.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-${{ matrix.backend }}${{ inputs.artifact_suffix }}
          path: |
            bench.txt
            uvicorn.log
            .var/bench/
            !.var/bench/**/videos/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the run videos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: run-videos-${{ matrix.backend }}${{ inputs.artifact_suffix }}
          path: .var/bench/**/videos/*.mp4
          if-no-files-found: ignore
          retention-days: 14
