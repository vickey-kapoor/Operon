name: Live desktop benchmark

# Runs the live desktop benchmark (tests/eval/live_desktop_bench.py) on a
# GitHub-hosted Windows runner, whose interactive session has a real desktop
# for the agent to drive. Manual only: every run spends model credits.
# Needs repo secret GEMINI_API_KEY (the judge and verifier are Gemini), and
# ANTHROPIC_API_KEY when desktop_backend is claude_computer_use or planner_provider is anthropic.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke (3 tasks) or full (10 tasks)"
        type: choice
        options: [full, smoke]
        default: full
      desktop_backend:
        description: "OPERON_DESKTOP_BACKEND: json (Gemini) or claude_computer_use"
        type: choice
        options: [json, claude_computer_use]
        default: json
      harness_profile:
        description: "OPERON_HARNESS_PROFILE for Claude: thin (default) or full. Gemini always runs full."
        type: choice
        options: [thin, full]
        default: thin
      desktop_model:
        description: "OPERON_DESKTOP_MODEL (empty keeps the server default)"
        default: ""
      planner_provider:
        description: "OPERON_DESKTOP_PLANNER_PROVIDER"
        type: choice
        options: [gemini, anthropic]
        default: gemini
      args:
        description: "Extra live_bench arguments, e.g. --category shell --only cmd_echo"
        default: ""
  # Called by bench-command.yml when someone comments /bench desktop on a PR.
  workflow_call:
    inputs:
      suite: {type: string, default: "smoke"}
      desktop_backend: {type: string, default: "claude_computer_use"}
      harness_profile: {type: string, default: "thin"}
      desktop_model: {type: string, default: ""}
      planner_provider: {type: string, default: "gemini"}
      args: {type: string, default: ""}
      ref:
        description: "Git ref to benchmark (empty: the triggering ref)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  bench:
    name: Bench (desktop)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      UV_PYTHON: "3.14"
      PYTHONUTF8: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPERON_DESKTOP_PLANNER_PROVIDER: ${{ inputs.planner_provider }}
      OPERON_DESKTOP_BACKEND: ${{ inputs.desktop_backend }}
      OPERON_HARNESS_PROFILE: ${{ inputs.harness_profile }}
    steps:
      - name: Check the secrets
        run: |
          $missing = @()
          if (-not $env:GEMINI_API_KEY) { $missing += "GEMINI_API_KEY" }
          $needsClaude = $env:OPERON_DESKTOP_PLANNER_PROVIDER -eq "anthropic" -or $env:OPERON_DESKTOP_BACKEND -eq "claude_computer_use"
          if ($needsClaude -and -not $env:ANTHROPIC_API_KEY) { $missing += "ANTHROPIC_API_KEY" }
          if ($missing.Count -gt 0) {
            Write-Output "::error::Missing repository secret(s): $($missing -join ', '). Add them under Settings > Secrets and variables > Actions."
            exit 1
          }

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Set the desktop model
        if: inputs.desktop_model != ''
        env:
          DESKTOP_MODEL: ${{ inputs.desktop_model }}
        run: Add-Content -Path $env:GITHUB_ENV -Value "OPERON_DESKTOP_MODEL=$env:DESKTOP_MODEL"

      - name: Set the screen to 1920x1080
        # The runner's session starts at 1024x768; the agent works better on a full-size screen.
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Start the API and run the benchmark
        # One step on purpose: Windows runners kill a step's child processes when the
        # step ends, so an API started in an earlier step is gone before the benchmark runs.
        # Hidden window: a visible console would sit on the desktop the agent is driving.
        env:
          SUITE: ${{ inputs.suite }}
          EXTRA_ARGS: ${{ inputs.args }}
        run: |
          Start-Process -FilePath uv -WindowStyle Hidden `
            -ArgumentList "run", "python", "-m", "uvicorn", "operon.api.server:app", "--host", "127.0.0.1", "--port", "8080" `
            -RedirectStandardOutput uvicorn.log -RedirectStandardError uvicorn.err.log
          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              Invoke-WebRequest -Uri http://127.0.0.1:8080/health -UseBasicParsing -TimeoutSec 2 | Out-Null
              $up = $true
              break
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $up) {
            Get-Content uvicorn.log, uvicorn.err.log -ErrorAction SilentlyContinue
            exit 1
          }
          $extra = if ($env:EXTRA_ARGS) { $env:EXTRA_ARGS -split '\s+' } else { @() }
          uv run python -m tests.eval.live_desktop_bench --suite $env:SUITE --keep-screens @extra | Tee-Object -FilePath bench.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { Get-Content uvicorn.err.log -Tail 40 -ErrorAction SilentlyContinue }
          exit $code

      - name: Summary
        if: always()
        run: |
          $report = if (Test-Path bench.txt) { Get-Content bench.txt -Tail 40 } else { "no report" }
          @("## desktop", '```') + $report + @('```') | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-desktop
          # .var/bench holds the JSON report and each task's graded screenshot.
          path: |
            bench.txt
            uvicorn.log
            uvicorn.err.log
            .var/bench/
          if-no-files-found: ignore
          retention-days: 14
