name: Nightly benchmark run
run-name: Nightly benchmark run (${{ github.event_name == 'schedule' && '2 AM' || 'manual' }})

# The one paid run of the day (KAN-165). At 2 AM Chicago it runs the cells queued in
# evals/nightly-queue.txt that fit tonight's budget, as one "Benchmark batch": at most $10
# a night, and nothing once this month's spend (from the dashboard database) reaches $100.
# If the month's spend can't be read, nothing runs. Lines that already ran are remembered
# in the "nightly-state" artifact, so a line runs once. Results go to the dashboard and the
# daily summary on Slack (posted by the dashboard import after this run). Run it by hand with dry_run to see the plan (free).
on:
  schedule:
    - cron: "23 8 * * *"  # about 2:25 AM Chicago in winter (CST), 3:25 AM in summer (CDT); off the top of the hour, when GitHub delays or drops scheduled runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the plan: run nothing and mark nothing as run"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Pick tonight's cells
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      budget: ${{ steps.plan.outputs.budget }}
      cells: ${{ steps.plan.outputs.cells }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install the Postgres driver
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.9"

      - name: Get the list of lines already run
        # Stops the night (nothing is charged) if the history can't be read: a missing list would run old cells again.
        run: |
          set -euo pipefail
          mkdir -p state
          info=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=nightly-state&per_page=1" --jq '[.total_count, (.artifacts[0].id // "")] | @tsv')
          read -r count id <<< "$info"
          if [ "$count" = "0" ]; then
            echo "No earlier nightly list: this is the first run."
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > state.zip
            unzip -o state.zip -d state
            echo "Using the list from artifact $id."
          fi

      - id: plan
        run: |
          flags=""
          if [ "$DRY_RUN" = "true" ]; then flags="--dry-run"; fi
          python3 -m evals.nightly plan --done state/done.txt $flags

      # Always, so the lines marked as run survive even if the batch below fails (no second charge).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && hashFiles('state/done.txt') != '' }}
        with:
          name: nightly-state
          path: state/done.txt
          retention-days: 90

  batch:
    name: Run tonight's batch
    needs: plan
    if: needs.plan.outputs.run == 'true'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/bench-batch.yml
    with:
      cells: ${{ needs.plan.outputs.cells }}
      max_total_usd: ${{ needs.plan.outputs.budget }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
