# PR gate (KAN-216, KAN-227): label every PR low-risk, risky or needs-vickey, and merge the low-risk and risky ones that are
# fully reviewed (risky also needs a Fable 5.2 top-review marker). A needs-vickey PR is never merged here: Vickey merges it.
# A PR whose only gap is the "Real check:" line with a link (KAN-298) is not merged: the sweep leaves one note per head.
#
# All decisions live in scripts/pr_gate.py (offline tested). The merge step only runs when the repo
# variable OPERON_AUTO_MERGE is "on". Unset (the default) is trial mode: label, plus one "would merge"
# note per head commit, and nothing is merged by the gate. Never pull_request_target; the label job
# runs main's copy of the script, and no PR-controlled text is put into a command (it goes through env
# or files). The label is advisory: on pull_request this workflow file comes from the PR itself, so a PR that edits it
# can change what its own label job does. What enforces is the sweep on main: it reclassifies every PR with main's
# script from the PR's files and refuses needs-vickey, whatever the labels or notes say.
name: PR gate

on:
  pull_request:
    branches: ["main", "master"]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "*/30 * * * *" # sweep: merge (or note) PRs that became ready
    - cron: "17 6 * * *" # once a day: report what the gate did
  workflow_dispatch:

permissions: {}

jobs:
  label:
    name: Label PR
    # A fork's token is read-only, and a fork PR is never auto-merged anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-gate-label-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The base commit's script, not the PR's copy (the workflow file itself is the PR's: see the header).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Classify and label
        run: |
          set -euo pipefail
          gh label create low-risk --repo "$REPO" --color 0E8A16 --description "Auto-merge candidate (KAN-216)" --force
          gh label create risky --repo "$REPO" --color D93F0B --description "Merges after a Fable 5.2 review (KAN-227)" --force
          gh label create needs-vickey --repo "$REPO" --color B60205 --description "Changes paid-run workflows, the merge check, cost files or workflow secrets: Vickey merges (KAN-227)" --force
          gh api --paginate "repos/$REPO/pulls/$PR/files" | jq -s 'add // []' > "$RUNNER_TEMP/files.json"
          # The base script may predate --repo/--ref (it then cannot read agent files, which only matters after merge).
          extra=()
          if python3 scripts/pr_gate.py classify --help | grep -q -e '--ref'; then extra=(--repo "$REPO" --ref "$HEAD_SHA"); fi
          risk=$(python3 scripts/pr_gate.py classify --files "$RUNNER_TEMP/files.json" "${extra[@]}")
          case "$risk" in
            low-risk) add=low-risk; r1=risky; r2=needs-vickey ;;
            needs-vickey) add=needs-vickey; r1=low-risk; r2=risky ;;
            *) add=risky; r1=low-risk; r2=needs-vickey ;;
          esac
          gh pr edit "$PR" --repo "$REPO" --add-label "$add" --remove-label "$r1" --remove-label "$r2"
          # The label was called paid-run before: drop a stale one so old PRs are relabelled cleanly.
          current=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if printf '%s\n' "$current" | grep -qx paid-run; then
            gh pr edit "$PR" --repo "$REPO" --remove-label paid-run
          fi

  sweep:
    name: Sweep and merge
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the squash merge
      pull-requests: write
      checks: read
      statuses: read
      issues: read # the pause check (KAN-229)
    concurrency:
      group: pr-gate-sweep
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      AUTO_MERGE: ${{ vars.OPERON_AUTO_MERGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every open low-risk or risky PR
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gate"
          mkdir -p "$work"
          # KAN-229: an open issue labelled auto-work-paused stops all merging and would-merge notes. Fail closed:
          # if the lookup fails, the issues file is removed and the script reports paused. Checked again before
          # every merge and note, so a pause set mid-sweep takes effect.
          pause_state() {
            gh api --paginate "repos/$REPO/issues?state=open&labels=auto-work-paused&per_page=100" | jq -s 'add // []' > "$work/issues.json" || rm -f "$work/issues.json"
            python3 scripts/pr_gate.py paused --issues "$work/issues.json" 2>/dev/null || echo paused
          }
          if [ "$(pause_state)" != running ]; then
            echo "Auto-work is paused: merging nothing and posting no notes."
            exit 0
          fi
          # --- end of the pause check ---
          gh label create auto-merged --repo "$REPO" --color 5319E7 --description "Merged by the PR gate" --force
          gh label create gate-would-merge --repo "$REPO" --color FBCA04 --description "Would merge: the gate would have merged this (KAN-216/KAN-227)" --force
          # Open, non-draft PRs labelled low-risk or risky; needs-vickey is never listed (and merge-ready refuses it anyway).
          gh pr list --repo "$REPO" --state open --draft=false --label low-risk --limit 100 --json number --jq '.[].number' > "$work/prs"
          gh pr list --repo "$REPO" --state open --draft=false --label risky --limit 100 --json number --jq '.[].number' >> "$work/prs"
          while read -r n; do
            [ -n "$n" ] || continue
            d="$work/$n"
            mkdir -p "$d"
            # One PR's API failure is a warning, not the end of the sweep.
            if ! gh api "repos/$REPO/pulls/$n" > "$d/pr.json"; then
              echo "::warning::PR $n: could not read the PR, skipped"
              continue
            fi
            sha=$(jq -r '.head.sha' "$d/pr.json") || sha=""
            case "$sha" in (*[!0-9a-f]* | "") echo "::warning::PR $n: odd head sha, skipped"; continue;; esac
            [ "${#sha}" -eq 40 ] || { echo "::warning::PR $n: odd head sha, skipped"; continue; }
            if ! {
              gh api --paginate "repos/$REPO/pulls/$n/files" | jq -s 'add // []' > "$d/files.json" &&
                gh api --paginate "repos/$REPO/commits/$sha/check-runs" --jq '.check_runs[]' | jq -s '.' > "$d/checks.json" &&
                gh api "repos/$REPO/commits/$sha/status" > "$d/status.json" &&
                gh api --paginate "repos/$REPO/issues/$n/comments" | jq -s 'add // []' > "$d/comments.json"
            }; then
              echo "::warning::PR $n: an API read failed, skipped"
              continue
            fi
            verdict=$(python3 scripts/pr_gate.py merge-ready --pr "$d/pr.json" --files "$d/files.json" \
              --checks "$d/checks.json" --status "$d/status.json" --comments "$d/comments.json" \
              --ignore-check "Label PR" --ignore-check "Sweep and merge" 2>"$d/why.txt") || verdict=error
            cat "$d/why.txt"
            if [ "$verdict" = no-real-check ]; then
              # KAN-298: never merge, never label; one note per head commit, then on to the next PR.
              if [ "$(pause_state)" != running ]; then
                echo "Auto-work is paused: merging nothing and posting no notes."
                exit 0
              fi
              if ! jq -e --arg m "operon-gate-real-check: $sha" \
                'any(.[]; .user.login == "github-actions[bot]" and ((.body // "") | contains($m)))' "$d/comments.json" > /dev/null; then
                printf '<!-- operon-gate-real-check: %s -->\nNot merged yet: the description has no "Real check:" line with a link to a real $0 run (a real end-to-end test run, a GitHub dry run, or a replay of real data). Add one: put it on its own top-level line, before any code block, quote or HTML. The next sweep can merge it (KAN-298).\n' "$sha" > "$d/real-check.md"
                gh pr comment "$n" --repo "$REPO" --body-file "$d/real-check.md" || echo "::warning::PR $n: the real-check note failed"
              fi
              continue
            fi
            [ "$verdict" = ready ] || continue
            if [ "$(pause_state)" != running ]; then
              echo "Auto-work is paused: merging nothing and posting no notes."
              exit 0
            fi
            if [ "$AUTO_MERGE" = on ]; then
              if gh pr merge "$n" --repo "$REPO" --squash --match-head-commit "$sha"; then
                gh pr edit "$n" --repo "$REPO" --add-label auto-merged || echo "::warning::PR $n: merged, but adding the auto-merged label failed"
              else
                echo "::warning::PR $n: merge refused (head moved or branch rules); next sweep retries"
              fi
            elif ! jq -e --arg m "operon-gate-trial: $sha" \
              'any(.[]; .user.login == "github-actions[bot]" and ((.body // "") | contains($m)))' "$d/comments.json" > /dev/null; then
              printf '<!-- operon-gate-trial: %s -->\nWould merge: the gate would merge this PR (OPERON_AUTO_MERGE is not on).\n' "$sha" > "$d/note.md"
              gh pr comment "$n" --repo "$REPO" --body-file "$d/note.md" || { echo "::warning::PR $n: the trial note failed"; continue; }
              gh pr edit "$n" --repo "$REPO" --add-label gate-would-merge || echo "::warning::PR $n: adding the gate-would-merge label failed"
            fi
          done < "$work/prs"

  daily:
    name: Daily note
    # KAN-223: once a day on the schedule only (hand-started sweeps report nothing), and no Slack post:
    # what merged reaches Vickey in the Monday summary.
    if: github.event_name == 'schedule' && github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the checkout (scripts/pr_gate.py paused)
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      AUTO_MERGE: ${{ vars.OPERON_AUTO_MERGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Summarise the last 24 hours
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Auto-merged: merged in the last 24 h by the workflow's own token (not by a label).
          merged=$(gh pr list --repo "$REPO" --state merged --search "merged:>=$cutoff" --limit 100 --json number,title,mergedAt,mergedBy \
            | jq -r --arg c "$cutoff" '[.[] | select(.mergedAt >= $c and ((.mergedBy.login // "") | startswith("github-actions")))
                | "- #\(.number) \(.title | gsub("[^A-Za-z0-9 .,:()_/-]"; ""))"] | join("\n")')
          # Would merge: a trial note (operon-gate-trial comment) was posted in the last 24 h.
          would=$(gh api --paginate "repos/$REPO/issues/comments?since=$cutoff&per_page=100" \
            | jq -rs --arg c "$cutoff" '[.[][] | select(.created_at >= $c and .user.login == "github-actions[bot]" and ((.body // "") | contains("operon-gate-trial:")))
                | "- #\(.issue_url | split("/") | last)"] | unique | join("\n")')
          mode=trial
          [ "$AUTO_MERGE" = on ] && mode=on
          # KAN-229: report the pause state (fail closed: a failed lookup reads as paused).
          gh api --paginate "repos/$REPO/issues?state=open&labels=auto-work-paused&per_page=100" | jq -s 'add // []' > "$RUNNER_TEMP/issues.json" || rm -f "$RUNNER_TEMP/issues.json"
          pause=$(python3 scripts/pr_gate.py paused --issues "$RUNNER_TEMP/issues.json" 2>/dev/null) || pause=paused
          [ "$pause" = running ] && pause=no || pause="Paused (merges nothing)"
          note=$(printf 'PR gate (auto-merge: %s), last 24 h\nPause: %s\nAuto-merged:\n%s\nWould have merged (trial):\n%s\n' \
            "$mode" "$pause" "${merged:-none}" "${would:-none}")
          printf '%s\n' "$note" >> "$GITHUB_STEP_SUMMARY"
