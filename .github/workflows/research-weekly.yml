name: Weekly research scan
run-name: Weekly research scan (new arXiv papers)

# Every Monday: look for new arXiv papers on computer-use agents (grounding, agent designs,
# world models, benchmarks, safety), add them under "Weekly scans" on the Confluence page
# "Research: reading list and paper notes" and in docs/research/reading-list.md (a PR with
# auto-merge). Free: arXiv's public API only, no model call. Nothing happens in a week with
# no new papers. Run it by hand to scan a different window (days input).
#
# Secrets (repository settings): CONFLUENCE_EMAIL and CONFLUENCE_API_TOKEN (an Atlassian API
# token) turn on the Confluence update; without them only the git copy changes.
# RESEARCH_PR_TOKEN (optional, a token that can open pull requests) makes the PR run the
# required checks; PRs opened with the default token do not trigger CI.
on:
  schedule:
    - cron: "0 13 * * 1"  # 7 AM Chicago (CST)
  workflow_dispatch:
    inputs:
      days:
        description: "Look back this many days"
        default: "7"

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    name: Scan arXiv and open the update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.RESEARCH_PR_TOKEN || github.token }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RESEARCH_PR_TOKEN || github.token }}

      - name: Scan arXiv
        run: python3 scripts/research_scan.py --days "${{ inputs.days || '7' }}"

      - name: Open a PR for the git copy
        run: |
          if git diff --quiet -- docs/research; then
            echo "No new papers, nothing to commit."
            exit 0
          fi
          branch="research/weekly-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/research
          git commit -m "Docs: weekly research scan $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Docs: weekly research scan $(date -u +%Y-%m-%d)" \
            --body "New arXiv papers added to docs/research/reading-list.md by the weekly scan (abstract excerpts, not reviewed). Same list is added to the Confluence page when its secrets are set.")
          gh pr merge "$url" --auto --squash || echo "::warning::Could not turn on auto-merge for $url"
