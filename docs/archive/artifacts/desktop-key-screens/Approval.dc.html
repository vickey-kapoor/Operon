<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operon approval card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA4B2}a:hover{color:#E8ECF1}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; background: #0B0E13; color: #E8ECF1; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center">
<div style="width: 520px; background: #151A21; border: 1px solid #2A313C; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 0">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #F2A65A"></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #F2A65A">WAITING FOR YOUR OK</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 20px 16px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.25">Move 14 files to Documents › Invoices?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #9AA4B2">From Downloads. Nothing is deleted, and you can undo this afterwards.</p>
</div>
<div style="margin: 0 20px; background: #0F1318; border: 1px solid #2A313C; border-radius: 8px; display: flex; flex-direction: column; font-family: 'JetBrains Mono', monospace; font-size: 13px">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #2A313C">
<span>invoice-october.pdf</span>
<span style="color: #9AA4B2">212 KB</span>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #2A313C">
<span>receipt-internet.pdf</span>
<span style="color: #9AA4B2">88 KB</span>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px">
<a href="#all-files" style="text-decoration: none">and 12 more, see all</a>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px">
<button type="button" style="height: 46px; background: {{accent}}; border: 0; border-radius: 8px; color: #0B0E13; font-family: inherit; font-size: 15px; font-weight: 600">Allow once</button>
<div style="display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 44px; background: #1D232C; border: 1px solid #2A313C; border-radius: 8px; color: #E8ECF1; font-family: inherit; font-size: 14px; font-weight: 500">Always allow moves to this folder</button>
<button type="button" style="width: 130px; height: 44px; background: transparent; border: 1px solid #2A313C; border-radius: 8px; color: #E8ECF1; font-family: inherit; font-size: 14px; font-weight: 500">Don't allow</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 20px; height: 44px; border-top: 1px solid #2A313C; font-size: 13px; color: #9AA4B2">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9AA4B2" stroke-width="1.5"><path d="M8 1.5l5 2v4c0 3.2-2.1 5.6-5 7-2.9-1.4-5-3.8-5-7v-4z"></path></svg>
<span>You have approved moves like this 3 times. Operon asks less as you allow more.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6CB6FF","options":["#6CB6FF","#5EEAD4","#F2A65A"]},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#6CB6FF' };
}
}
</script>
</body>
</html>
