<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operon running pill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA4B2}a:hover{color:#E8ECF1}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; background: #0B0E13; color: #E8ECF1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
<div style="height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 6px 0 16px; background: #151A21; border: 1px solid #2A313C; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.5)">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: {{accent}}; box-shadow: 0 0 0 4px rgba(108,182,255,0.18)"></span>
<span style="font-size: 14px; font-weight: 600">Working</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA4B2">step 4</span>
<span aria-hidden="true" style="width: 1px; height: 20px; background: #2A313C"></span>
<button type="button" aria-label="Stop Operon" style="width: 44px; height: 32px; display: flex; align-items: center; justify-content: center; background: #2A1E14; border: 1px solid #F2A65A; border-radius: 16px">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="2" fill="#F2A65A"></rect></svg>
</button>
</div>
<div style="width: 440px; background: #151A21; border: 1px solid #2A313C; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 600">Sort my Downloads folder</h1>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA4B2">0:48</span>
</div>
<div style="margin: 0 16px; height: 190px; background: #0B0E13; border: 1px dashed #3A4350; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#9AA4B2" stroke-width="1.6"><rect x="3" y="5" width="22" height="15" rx="2"></rect><path d="M10 24h8M14 20v4"></path></svg>
<span style="font-size: 13px; color: #9AA4B2">Live view of what Operon sees</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 4px; font-size: 14px">
<div style="display: flex; align-items: center; gap: 10px; color: #9AA4B2">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9AA4B2" stroke-width="1.8"><path d="M3 8.5l3.2 3L13 4.5"></path></svg>
<span>Found 14 PDFs in Downloads</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 16px; display: flex; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span></span>
<span>Opening the Invoices folder</span>
</div>
</div>
<div style="display: flex; gap: 8px; padding: 12px 16px 14px">
<button type="button" style="flex-grow: 1; height: 44px; background: #1D232C; border: 1px solid #2A313C; border-radius: 8px; color: #E8ECF1; font-family: inherit; font-size: 14px; font-weight: 500">Pause</button>
<button type="button" style="flex-grow: 1; height: 44px; background: #1D232C; border: 1px solid #2A313C; border-radius: 8px; color: #E8ECF1; font-family: inherit; font-size: 14px; font-weight: 500">Take over</button>
<button type="button" style="flex-grow: 1; height: 44px; background: #2A1E14; border: 1px solid #F2A65A; border-radius: 8px; color: #F2A65A; font-family: inherit; font-size: 14px; font-weight: 600">Stop</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 40px; border-top: 1px solid #2A313C; font-size: 12px; color: #9AA4B2">
<span style="font-family: 'JetBrains Mono', monospace; border: 1px solid #2A313C; border-radius: 6px; padding: 2px 6px">Ctrl + Shift + X</span>
<span>stops everything, from anywhere</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6CB6FF","options":["#6CB6FF","#5EEAD4","#F2A65A"]},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#6CB6FF' };
}
}
</script>
</body>
</html>
