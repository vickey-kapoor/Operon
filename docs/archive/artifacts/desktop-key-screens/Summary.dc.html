<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operon run summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9AA4B2}a:hover{color:#E8ECF1}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; background: #0B0E13; color: #E8ECF1; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center">
<div style="width: 540px; background: #151A21; border: 1px solid #2A313C; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 0">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="{{accent}}" stroke-width="2"><circle cx="9" cy="9" r="7"></circle><path d="M5.5 9.5l2.3 2.2L12.5 7"></path></svg>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: {{accent}}">DONE IN 2 MIN 14 S</span>
</div>
<div style="padding: 10px 20px 14px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.25">Sorted your Downloads folder</h1>
</div>
<div style="margin: 0 20px; display: flex; flex-direction: column; font-size: 15px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #2A313C">
<span style="width: 34px; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; text-align: right">14</span>
<span style="flex-grow: 1">PDFs moved to Documents › Invoices</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #2A313C">
<span style="width: 34px; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; text-align: right">9</span>
<span style="flex-grow: 1">images moved to Pictures › Screenshots</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #2A313C; border-bottom: 1px solid #2A313C; color: #9AA4B2">
<span style="width: 34px; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; text-align: right">3</span>
<span style="flex-grow: 1">installers left in place, as you chose</span>
</div>
</div>
<div style="display: flex; gap: 8px; padding: 16px 20px">
<button type="button" style="flex-grow: 1; height: 46px; background: {{accent}}; border: 0; border-radius: 8px; color: #0B0E13; font-family: inherit; font-size: 15px; font-weight: 600">Save as routine</button>
<button type="button" style="width: 120px; height: 46px; background: #1D232C; border: 1px solid #2A313C; border-radius: 8px; color: #E8ECF1; font-family: inherit; font-size: 14px; font-weight: 500">Undo all</button>
<button type="button" style="width: 150px; height: 46px; background: #1D232C; border: 1px solid #2A313C; border-radius: 8px; color: #E8ECF1; font-family: inherit; font-size: 14px; font-weight: 500">Watch recording</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 0 20px; height: 44px; border-top: 1px solid #2A313C; font-size: 13px; color: #9AA4B2">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9AA4B2" stroke-width="1.8"><path d="M3 8.5l3.2 3L13 4.5"></path></svg>
<span>23 actions, each one checked on screen after it happened</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6CB6FF","options":["#6CB6FF","#5EEAD4","#F2A65A"]},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#6CB6FF' };
}
}
</script>
</body>
</html>
