[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operon-agent"
version = "0.1.0"
description = "Vision-driven computer-use engine for UI-native automation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
keywords = ["computer-use", "agent", "automation", "gemini", "vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.162.3,<1.0.0",
    "pydantic>=2.14.3,<3.0.0",
    "python-dotenv>=1.2.4,<2.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "pyautogui>=0.9.54,<1.0.0",
    "mss>=9.0.0,<11.0.0",
    "pyperclip>=1.8.0,<2.0.0",
    "Pillow>=13.0.0,<14.0.0",
    "httpx[http2]>=0.28.1,<1.0.0",
    "opencv-python-headless>=5.0.0.93,<6.0.0",
    "numpy>=2.5.4,<3.0.0",
    "playwright>=1.65.0,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/vickey-kapoor/Operon"
Documentation = "https://github.com/vickey-kapoor/Operon/tree/main/docs"
Issues = "https://github.com/vickey-kapoor/Operon/issues"

[project.scripts]
operon = "operon.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1.post1,<2.0.0",
    "ruff>=0.17.4,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "mypy>=2.4.1,<3.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]
notifications = [
    "win11toast>=0.36.0",
]
dashboard = [
    "psycopg[binary]>=3.3",
]
# KAN-163: local text recognition for the trust gate (OPERON_CLICK_TEXT).
ocr = [
    "rapidocr>=3.10.0,<4.0.0",
    "onnxruntime>=1.32.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["operon*"]

[tool.setuptools.package-data]
operon = ["prompts/*.txt", "prompts/tools/*.md", "agent/backends/model_adapter/models.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "desktop_container: end-to-end desktop tests on the Linux desktop container (needs Docker; opt in with -m desktop_container, KAN-166)",
    "windows_sandbox: end-to-end desktop tests on a real Windows desktop in Windows Sandbox (needs Windows Sandbox; opt in with -m windows_sandbox, KAN-93)",
    "browser_e2e: end-to-end browser tests: the real loop and executor on headless Chromium, scripted model, $0 (opt in with -m browser_e2e)",
    "asyncio: mark a test as using asyncio",
    "windows_only: needs Windows; skipped elsewhere by tests/conftest.py",
    "linux_only: needs Linux; skipped elsewhere by tests/conftest.py",
    "live_server: requires a running uvicorn server at localhost:8080 (opt-in via OPERON_RUN_LIVE_SERVER_TESTS=true)",
]
# CI runs only fast/safe tests by default. Use `pytest -m live_server` to opt into
# the server-required suites (or set OPERON_RUN_LIVE_SERVER_TESTS=true).
addopts = "-m 'not live_server and not desktop_container and not windows_sandbox and not browser_e2e'"
filterwarnings = [
    # starlette 1.2.x emits this purely on importing TestClient. We can't act on
    # it without migrating off httpx (which FastAPI's TestClient still requires),
    # so silence the one message rather than let it spam every test run.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["operon", "evals", "tests"]

[tool.mypy]
# KAN-159: CI type check. Starts from a baseline: modules that had errors when the
# check was added are listed below with ignore_errors, so CI is green and every
# other module (and every new one) is checked. Tighten by fixing a module and
# deleting it from the list.
python_version = "3.14"
files = ["src/operon"]
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "operon.agent.actions.selector",
    "operon.agent.actions.translation",
    "operon.agent.artifacts.screen_recorder",
    "operon.agent.backends.browser_claude_computer_use",
    "operon.agent.backends.browser_computer_use",
    "operon.agent.backends.model_adapter.actions",
    "operon.agent.backends.model_adapter.backend",
    "operon.agent.backends.model_adapter.formats.opencua",
    "operon.agent.backends.model_adapter.images",
    "operon.agent.backends.model_adapter.openai_native",
    "operon.agent.hitl",
    "operon.agent.loop",
    "operon.agent.perception.screen_diff",
    "operon.api.frontdoor",
    "operon.api.observer",
    "operon.api.runtime.loops",
    "operon.api.runtime.services",
    "operon.api.ws_stream",
    "operon.cli",
    "operon.clients.gemini",
    "operon.clients.gemini_computer_use",
    "operon.executor.browser_native",
    "operon.executor.desktop",
    "operon.models.perception",
    "operon.store.memory",
    "operon.store.replay",
]
ignore_errors = true

[tool.coverage.run]
source = ["operon"]
branch = true

[tool.coverage.report]
skip_empty = true
