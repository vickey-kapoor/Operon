<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operon — Benchmarks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0d0c;
    --bg-panel:  #161412;
    --bg-hover:  #1a1816;
    --border:    #252321;
    --border-sub:#1a1816;
    --text:      #e8e4dc;
    --muted:     #7a756c;
    --dim:       #4a453e;
    --neutral:   #a8a29a;
    --amber:     #d97706;
    --amber-bg:  #1f1408;
    --amber-bdr: #3a2a14;
    --green:     #84cc16;
    --red:       #dc2626;
    --sans:      'IBM Plex Sans', system-ui, sans-serif;
    --mono:      'IBM Plex Mono', ui-monospace, monospace;
    --cond:      'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.4;
    min-height: 100vh;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
  *::-webkit-scrollbar { width: 4px; }
  *::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 99px; }

  /* ── Header ─────────────────────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 48px;
    border-bottom: 1px solid var(--border);
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .logo-sq {
    width: 26px; height: 26px; border-radius: 5px;
    background: linear-gradient(135deg, #d97706, #f59e0b);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--cond); font-weight: 700; font-size: 13px; color: #0e0d0c;
  }
  .brand { font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .nav-btn {
    padding: 5px 12px; font-size: 13px; font-family: var(--sans);
    background: transparent; border: none; border-radius: 4px;
    color: var(--muted); cursor: pointer; transition: all 0.1s; font-weight: 400;
  }
  .nav-btn:hover { color: var(--text); background: var(--bg-hover); }
  .nav-btn.active { background: var(--bg-hover); color: var(--text); font-weight: 500; }

  /* ── Page ───────────────────────────────────────────────────────────────── */
  .page { max-width: 1500px; margin: 0 auto; padding: 24px 32px 60px; }

  /* ── Controls strip ─────────────────────────────────────────────────────── */
  .controls {
    padding: 14px 16px; border-radius: 6px; margin-bottom: 10px;
    background: var(--bg-panel); border: 1px solid var(--border);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .fg-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--muted);
  }
  .fg-btns { display: flex; gap: 4px; }
  .fg-btn {
    padding: 4px 10px; font-family: var(--mono); font-size: 12px;
    border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--neutral); cursor: pointer; transition: all 0.1s;
  }
  .fg-btn:hover { color: var(--text); border-color: var(--neutral); }
  .fg-btn.active { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-bdr); }

  .ctrl-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }

  .max-steps-input {
    width: 56px; padding: 4px 8px;
    font-family: var(--mono); font-size: 12px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; outline: none;
    transition: border-color 0.12s;
  }
  .max-steps-input:focus { border-color: var(--amber); }

  .run-suite-btn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 16px; font-family: var(--mono); font-size: 12px; font-weight: 500;
    color: #0e0d0c; background: var(--amber); border: none; border-radius: 4px;
    cursor: pointer; transition: opacity 0.1s;
  }
  .run-suite-btn:hover { opacity: 0.88; }
  .run-suite-btn:disabled { opacity: 0.35; cursor: default; }

  /* ── Stats strip ────────────────────────────────────────────────────────── */
  .stats-strip {
    padding: 14px 16px; border-radius: 6px; margin-bottom: 10px;
    background: var(--bg-panel); border: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 16px;
  }
  .si-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .si-value {
    font-family: var(--cond); font-weight: 700; font-size: 22px;
    line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .si-hint { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px; }

  /* ── Scoreboard ─────────────────────────────────────────────────────────── */
  .panel {
    padding: 18px 20px; border-radius: 6px;
    background: var(--bg-panel); border: 1px solid var(--border);
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .panel-title {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--neutral);
  }
  .panel-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); }
  thead tr { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  th { padding: 6px 0; font-weight: 500; text-align: left; }
  th.r { text-align: right; }
  tbody tr {
    font-size: 12.5px; border-top: 1px dashed var(--border-sub);
    transition: background 0.1s;
  }
  tbody tr:hover { background: var(--bg-hover); }
  tbody tr:hover .run-btn { opacity: 1; }
  td { padding: 9px 0; }
  td.r { text-align: right; }

  .source-tag {
    display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px;
  }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; }
  .pill-dot { width: 5px; height: 5px; border-radius: 50%; }
  .run-btn {
    padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border);
    font-family: var(--mono); font-size: 11px; color: var(--neutral);
    background: transparent; cursor: pointer; opacity: 0; transition: opacity 0.15s;
  }
  .run-btn:hover { background: var(--bg-hover); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* ── Confirm modal ──────────────────────────────────────────────────────── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(14,13,12,0.75); backdrop-filter: blur(2px);
    align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 28px 28px 22px; width: 360px;
    font-family: var(--mono);
  }
  .modal-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; }
  .modal-body  { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 22px; }
  .modal-body strong { color: var(--text); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-cancel {
    padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--neutral); cursor: pointer;
    font-family: var(--mono); font-size: 12px; transition: background 0.1s;
  }
  .modal-cancel:hover { background: var(--bg-hover); }
  .modal-confirm {
    padding: 6px 14px; border-radius: 4px; border: none;
    background: var(--amber); color: #0e0d0c; cursor: pointer;
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    transition: opacity 0.1s;
  }
  .modal-confirm:hover { opacity: 0.88; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="logo-sq">o</div>
    <div class="brand">OPERON</div>
  </div>
  <nav style="display:flex;align-items:center;gap:2px;">
    <button class="nav-btn" onclick="location.href='/command-center'">Command Center</button>
    <button class="nav-btn" onclick="location.href='/dashboard'">Dashboard</button>
    <button class="nav-btn active">Benchmarks</button>
  </nav>
</header>

<div class="page">

  <div class="controls">
    <span class="fg-label">source</span>
    <div class="fg-btns" id="fgSource"></div>
    <div class="ctrl-sep"></div>
    <span class="fg-label">difficulty</span>
    <div class="fg-btns" id="fgDiff"></div>
    <div class="ctrl-sep"></div>
    <span class="fg-label">status</span>
    <div class="fg-btns" id="fgStatus"></div>
    <div class="ctrl-sep"></div>
    <span class="fg-label" style="white-space:nowrap">max steps</span>
    <input class="max-steps-input" id="maxSteps" type="number" value="15" min="1" max="50">
    <button class="run-suite-btn" id="runSuiteBtn" onclick="runSuite()">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,1 9,5 1,9"/></svg>
      run suite
    </button>
  </div>

  <div class="stats-strip" id="statsStrip"></div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">scoreboard</div>
      <div class="panel-sub" id="scoreboardSub">loading…</div>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:90px">task</th>
          <th style="width:100px">source</th>
          <th style="width:70px">diff</th>
          <th style="width:90px">site</th>
          <th>intent</th>
          <th style="width:100px">status</th>
          <th style="width:110px">steps / opt</th>
          <th class="r" style="width:70px">eff</th>
          <th class="r" style="width:70px">duration</th>
          <th class="r" style="width:50px"></th>
        </tr>
      </thead>
      <tbody id="scoreTable"></tbody>
    </table>
  </div>

</div>

<!-- Run Suite confirmation modal -->
<div class="modal-backdrop" id="confirmBackdrop">
  <div class="modal-box">
    <div class="modal-title" id="confirmTitle">Run suite?</div>
    <div class="modal-body" id="confirmBody"></div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeConfirm()">cancel</button>
      <button class="modal-confirm" id="confirmBtn" onclick="confirmRunSuite()">run</button>
    </div>
  </div>
</div>

<script>
'use strict';

let allTasks = [];
let filters = { source: 'all', diff: 'all', status: 'all' };

function esc(v) {
  if (v == null) return '';
  const d = document.createElement('div'); d.textContent = String(v); return d.innerHTML;
}

function pillHtml(status) {
  const map = {
    passed:  { color: '#84cc16', label: 'passed',  pulse: false },
    failed:  { color: '#dc2626', label: 'failed',  pulse: false },
    running: { color: '#d97706', label: 'running', pulse: true  },
    pending: { color: '#7a756c', label: 'pending', pulse: false },
  };
  const s = map[status] || { color: '#7a756c', label: status || '—', pulse: false };
  const anim = s.pulse ? 'animation:pulse 1.2s ease-in-out infinite;display:inline-block' : '';
  return `<span class="pill" style="color:${s.color}"><span class="pill-dot" style="background:${s.color};${anim}"></span>${s.label}</span>`;
}

function stepsCell(steps, opt, status) {
  if (status === 'pending' || status === 'running' || steps == null) {
    return `<span style="font-variant-numeric:tabular-nums"><span style="color:var(--dim)">—</span><span style="color:var(--dim)"> / </span><span style="color:var(--muted)">${opt != null ? opt : '—'}</span></span>`;
  }
  const delta = steps - opt;
  const color = delta > 2 ? '#dc2626' : delta > 0 ? '#d97706' : '#84cc16';
  const badge = delta === 0
    ? `<span style="color:#84cc16;margin-left:6px">✓</span>`
    : `<span style="color:${color};margin-left:6px;font-size:11px">+${delta}</span>`;
  return `<span style="font-variant-numeric:tabular-nums"><span style="color:${color};font-weight:600;font-size:13.5px">${steps}</span><span style="color:var(--dim)"> / </span><span style="color:var(--muted)">${opt}</span>${badge}</span>`;
}

function effCell(val) {
  if (val == null) return `<span style="color:var(--dim)">—</span>`;
  const color = val > 2.5 ? '#dc2626' : val > 1.5 ? '#d97706' : '#84cc16';
  return `<span style="color:${color};font-variant-numeric:tabular-nums;font-weight:500">${val.toFixed(1)}×</span>`;
}

function sourceTag(source) {
  const lc = (source || '').toLowerCase();
  const style = lc === 'mind2web'
    ? 'background:#1f1408;color:#d97706'
    : lc === 'webarena'
    ? 'background:#0c1f1a;color:#84cc16'
    : 'background:var(--bg-hover);color:var(--neutral)';
  return `<span class="source-tag" style="${style}">${esc(lc || '—')}</span>`;
}

function buildFg(id, filterKey, options) {
  document.getElementById(id).innerHTML = options.map(([k, lbl]) =>
    `<button class="fg-btn${filters[filterKey]===k?' active':''}" onclick="setFilter('${filterKey}','${k}')">${esc(lbl)}</button>`
  ).join('');
}

function setFilter(key, val) { filters[key] = val; rebuildFilters(); renderTable(); }

function rebuildFilters() {
  const sources = [...new Set(allTasks.map(t => (t.source||'').toLowerCase()))].filter(Boolean);
  buildFg('fgSource', 'source', [
    ['all', `all (${allTasks.length})`],
    ...sources.map(s => [s, `${s} (${allTasks.filter(t => (t.source||'').toLowerCase() === s).length})`]),
  ]);
  buildFg('fgDiff', 'diff', [['all','all'],['easy','easy'],['medium','medium'],['hard','hard']]);
  buildFg('fgStatus', 'status', [['all','all'],['passed','passed'],['failed','failed'],['running','running'],['pending','pending']]);
}

function filteredTasks() {
  return allTasks.filter(t =>
    (filters.source === 'all' || (t.source||'').toLowerCase() === filters.source) &&
    (filters.diff   === 'all' || (t.diff||'').toLowerCase()   === filters.diff) &&
    (filters.status === 'all' || (t.status||'')               === filters.status)
  );
}

function renderStats() {
  const done   = allTasks.filter(t => t.status === 'passed' || t.status === 'failed');
  const passed = allTasks.filter(t => t.status === 'passed');
  const failed = allTasks.filter(t => t.status === 'failed');
  const running= allTasks.filter(t => t.status === 'running');
  const pr     = done.length > 0 ? (passed.length / done.length * 100) : 0;
  const avgEff = done.length > 0 ? done.reduce((s,t) => s + (t.efficiency || 0), 0) / done.length : 0;
  const avgDur = done.length > 0 ? done.reduce((s,t) => s + (t.duration  || 0), 0) / done.length : 0;

  document.getElementById('statsStrip').innerHTML = [
    ['total',     allTasks.length,         '#e8e4dc', ''],
    ['done',      done.length,             '#a8a29a', ''],
    ['passed',    passed.length,           '#84cc16', ''],
    ['failed',    failed.length,           '#dc2626', ''],
    ['running',   running.length,          '#d97706', ''],
    ['pass rate', pr.toFixed(0)+'%',       pr >= 50 ? '#84cc16' : '#d97706', ''],
    ['avg eff',   avgEff.toFixed(2)+'×',   avgEff <= 1.5 ? '#84cc16' : '#d97706', `avg ${avgDur.toFixed(1)}s`],
  ].map(([label, value, color, hint]) =>
    `<div><div class="si-label">${label}</div>
     <div class="si-value" style="color:${color}">${esc(String(value))}</div>
     ${hint ? `<div class="si-hint">${esc(hint)}</div>` : ''}</div>`
  ).join('');
}

function renderTable() {
  const tasks = filteredTasks();
  document.getElementById('scoreboardSub').textContent = `${tasks.length} of ${allTasks.length} tasks`;
  document.getElementById('scoreTable').innerHTML = tasks.map(t => {
    const diffColor = (t.diff || '') === 'easy' ? '#84cc16' : '#d97706';
    return `<tr>
      <td>${esc(t.id)}</td>
      <td>${sourceTag(t.source)}</td>
      <td style="color:${diffColor}">${esc(t.diff || '—')}</td>
      <td style="color:var(--muted)">${esc(t.site || '—')}</td>
      <td style="font-family:var(--sans);color:var(--neutral);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0;padding-right:16px" title="${esc(t.intent)}">${esc(t.intent || '—')}</td>
      <td>${pillHtml(t.status)}</td>
      <td>${stepsCell(t.steps, t.optSteps, t.status)}</td>
      <td class="r">${effCell(t.efficiency)}</td>
      <td class="r" style="color:var(--neutral);font-variant-numeric:tabular-nums">${t.duration != null ? t.duration.toFixed(1) + 's' : '—'}</td>
      <td class="r"><button class="run-btn" onclick="runTask(event,'${esc(t.id)}')">run</button></td>
    </tr>`;
  }).join('');
}

function _normaliseTask(t) {
  return {
    id:         t.task_id || t.id,
    source:     t.source || 'operon',
    diff:       t.difficulty || t.diff || '',
    category:   t.category || '',
    site:       t.site || '',
    intent:     t.intent || '',
    status:     t.status || 'pending',
    steps:      t.step_count    ?? t.steps    ?? null,
    optSteps:   t.optimal_steps ?? t.optSteps ?? null,
    efficiency: t.step_efficiency ?? t.efficiency ?? null,
    duration:   t.duration_seconds ?? t.duration ?? null,
    run_id:     t.run_id || null,
  };
}

async function load() {
  try {
    const r = await fetch('/benchmark/tasks');
    if (r.ok) allTasks = (await r.json()).map(_normaliseTask);
  } catch (_) {}

  // Restore last suite results from localStorage so the page doesn't open all-pending
  try {
    const lastId = localStorage.getItem('operon_last_suite_id');
    if (lastId) {
      const sr = await fetch('/benchmark/suite/' + encodeURIComponent(lastId));
      if (sr.ok) {
        const sd = await sr.json();
        const byId = Object.fromEntries((sd.tasks || []).map(t => [t.task_id, t]));
        allTasks = allTasks.map(t => {
          const saved = byId[t.id];
          return saved ? _normaliseTask({ ...t, ...saved }) : t;
        });
      }
    }
  } catch (_) {}

  rebuildFilters();
  renderStats();
  renderTable();
}

// ── Run Suite with confirmation ────────────────────────────────────────────

function runSuite() {
  const tasks = filteredTasks();
  if (tasks.length > 5) {
    const mins = Math.round(tasks.length * 2);
    const cost = (tasks.length * 0.18).toFixed(2);
    document.getElementById('confirmTitle').textContent = `Run ${tasks.length} tasks?`;
    document.getElementById('confirmBody').innerHTML =
      `This will run <strong>${tasks.length}</strong> tasks sequentially.<br>` +
      `Estimated time: <strong>~${mins} minutes</strong> · cost: <strong>~$${cost}</strong> at recent rates.`;
    document.getElementById('confirmBtn').textContent = `run ${tasks.length} tasks`;
    document.getElementById('confirmBackdrop').classList.add('open');
  } else {
    _doRunSuite();
  }
}

function closeConfirm() { document.getElementById('confirmBackdrop').classList.remove('open'); }
function confirmRunSuite() { closeConfirm(); _doRunSuite(); }

async function _doRunSuite() {
  const maxSteps = parseInt(document.getElementById('maxSteps').value) || 15;
  const btn = document.getElementById('runSuiteBtn');
  btn.disabled = true; btn.textContent = 'starting…';
  try {
    const r = await fetch('/benchmark/run-suite', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        difficulty: filters.diff === 'all' ? 'all' : filters.diff,
        source: filters.source === 'all' ? 'all' : filters.source,
        max_steps: maxSteps,
      }),
    });
    if (r.ok) {
      const d = await r.json();
      try { localStorage.setItem('operon_last_suite_id', d.suite_id); } catch(_) {}
      btn.textContent = 'suite started';
      setTimeout(() => { btn.disabled = false; btn.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,1 9,5 1,9"/></svg> run suite'; }, 3000);
      setTimeout(load, 2000);
    } else {
      btn.disabled = false; btn.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,1 9,5 1,9"/></svg> run suite';
    }
  } catch (_) { btn.disabled = false; btn.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="1,1 9,5 1,9"/></svg> run suite'; }
}

async function runTask(e, taskId) {
  e.stopPropagation();
  const maxSteps = parseInt(document.getElementById('maxSteps').value) || 15;
  const btn = e.currentTarget;
  const origText = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try {
    const r = await fetch('/benchmark/run-task', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task_id: taskId, max_steps: maxSteps }),
    });
    if (r.ok) {
      // API returns {suite_id, task_id, status} — poll suite for run_id, then navigate
      const d = await r.json();
      btn.textContent = 'queued';
      setTimeout(load, 1500);
      if (d.suite_id) {
        // Poll up to 8s for the task's run_id to appear in suite state
        let attempts = 0;
        const poll = setInterval(async () => {
          attempts++;
          try {
            const sr = await fetch('/benchmark/suite/' + d.suite_id);
            if (sr.ok) {
              const sd = await sr.json();
              const task = (sd.tasks || []).find(t => t.task_id === taskId);
              if (task?.run_id) {
                clearInterval(poll);
                location.href = '/command-center/' + encodeURIComponent(task.run_id);
              }
            }
          } catch(_) {}
          if (attempts >= 16) {
            clearInterval(poll);
            btn.disabled = false; btn.textContent = origText;
          }
        }, 500);
      }
    } else {
      btn.disabled = false; btn.textContent = origText;
    }
  } catch (_) { btn.disabled = false; btn.textContent = origText; }
}

document.addEventListener('DOMContentLoaded', load);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeConfirm(); });

setInterval(() => {
  if (allTasks.some(t => t.status === 'running')) load();
}, 5000);
</script>
</body>
</html>
