<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operon — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0e0d0c;
    --bg-panel:  #161412;
    --bg-hover:  #1a1816;
    --border:    #252321;
    --border-sub:#1a1816;
    --text:      #e8e4dc;
    --muted:     #7a756c;
    --dim:       #4a453e;
    --neutral:   #a8a29a;
    --amber:     #d97706;
    --amber-bg:  #1f1408;
    --amber-bdr: #3a2a14;
    --green:     #84cc16;
    --red:       #dc2626;
    --sans:      'IBM Plex Sans', system-ui, sans-serif;
    --mono:      'IBM Plex Mono', ui-monospace, monospace;
    --cond:      'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.4;
    min-height: 100vh;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }
  *::-webkit-scrollbar { width: 4px; }
  *::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 99px; }

  /* ── Header ─────────────────────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; height: 48px;
    border-bottom: 1px solid var(--border);
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .logo-sq {
    width: 26px; height: 26px; border-radius: 5px;
    background: linear-gradient(135deg, #d97706, #f59e0b);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--cond); font-weight: 700; font-size: 13px; color: #0e0d0c;
  }
  .brand { font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; }
  .nav-btn {
    padding: 5px 12px; font-size: 13px; font-family: var(--sans);
    background: transparent; border: none; border-radius: 4px;
    color: var(--muted); cursor: pointer; transition: all 0.1s; font-weight: 400;
  }
  .nav-btn:hover { color: var(--text); background: var(--bg-hover); }
  .nav-btn.active { background: var(--bg-hover); color: var(--text); font-weight: 500; }

  /* ── Page content ───────────────────────────────────────────────────────── */
  .page { max-width: 1400px; margin: 0 auto; padding: 24px 32px 60px; }

  .period-row { margin-bottom: 20px; }
  .period-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
  }
  .period-val {
    font-family: var(--mono); font-size: 14px; color: var(--text);
    display: flex; align-items: center; gap: 10px;
  }
  .period-sub { font-size: 11px; color: var(--muted); }

  /* ── Stat cards ─────────────────────────────────────────────────────────── */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }

  .stat-card {
    padding: 18px 20px; border-radius: 6px;
    background: var(--bg-panel); border: 1px solid var(--border);
  }
  .stat-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }
  .stat-value {
    font-family: var(--cond); font-weight: 700; font-size: 28px;
    line-height: 1; margin-bottom: 8px; letter-spacing: -0.02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stat-value.mono { font-family: var(--mono); font-size: 17px; font-weight: 500; letter-spacing: 0; }
  .stat-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ── Grid 2-col ─────────────────────────────────────────────────────────── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

  /* ── Panel ──────────────────────────────────────────────────────────────── */
  .panel {
    padding: 18px 20px; border-radius: 6px;
    background: var(--bg-panel); border: 1px solid var(--border);
  }
  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px;
  }
  .panel-title {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--neutral);
  }
  .panel-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ── Outcome bar ────────────────────────────────────────────────────────── */
  .outcome-bar {
    display: flex; height: 7px; border-radius: 3px; overflow: hidden;
    background: var(--border-sub); margin: 12px 0 20px;
  }
  .ob-succ { background: var(--green); }
  .ob-fail { background: var(--red); }

  .outcome-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0;
  }
  .or-left { display: flex; align-items: center; gap: 10px; }
  .or-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .or-label { font-size: 13px; }
  .or-count { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .or-right { display: flex; align-items: baseline; gap: 12px; }
  .or-avg { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .or-total { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 500; }

  .outcome-insight {
    margin-top: 16px; padding-top: 12px;
    border-top: 1px dashed var(--border-sub);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }

  /* ── Model spend ────────────────────────────────────────────────────────── */
  .model-row { margin-top: 14px; }
  .model-row + .model-row { margin-top: 14px; }
  .model-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .model-name { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .model-cost { font-family: var(--mono); font-size: 13px; color: var(--amber); font-variant-numeric: tabular-nums; font-weight: 500; }
  .model-bar-wrap { display: flex; align-items: center; gap: 12px; }
  .model-bar-track { flex: 1; height: 5px; border-radius: 2px; overflow: hidden; background: var(--border-sub); }
  .model-bar-fill { height: 100%; background: linear-gradient(90deg, #d97706, #f59e0b); }
  .model-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 140px; text-align: right; white-space: nowrap; }

  /* ── Run ledger ─────────────────────────────────────────────────────────── */
  .filter-row { display: flex; gap: 6px; margin: 12px 0 16px; }
  .filter-btn {
    padding: 4px 10px; font-family: var(--mono); font-size: 12px;
    border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--neutral); cursor: pointer; transition: all 0.1s;
  }
  .filter-btn.active {
    border-color: var(--amber-bdr); background: var(--amber-bg); color: var(--amber);
  }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); }
  thead tr { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  th { padding: 6px 0; font-weight: 500; text-align: left; }
  th.r { text-align: right; }
  tbody tr {
    font-size: 12.5px; border-top: 1px dashed var(--border-sub);
    cursor: pointer; transition: background 0.1s;
  }
  tbody tr:hover { background: var(--bg-hover); }
  td { padding: 9px 0; }
  td.r { text-align: right; }

  .run-id-chip { font-size: 10px; color: var(--dim); }
  .run-intent { font-family: var(--sans); color: var(--text); }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 11px;
  }
  .pill-dot { width: 5px; height: 5px; border-radius: 50%; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="logo-sq">o</div>
    <div class="brand">OPERON</div>
  </div>
  <nav style="display:flex;align-items:center;gap:2px;">
    <button class="nav-btn" onclick="location.href='/command-center'">Command Center</button>
    <button class="nav-btn active">Dashboard</button>
    <button class="nav-btn" onclick="location.href='/benchmarks'">Benchmarks</button>
  </nav>
</header>

<div class="page">

  <div class="period-row">
    <div class="period-label">billing period</div>
    <div class="period-val" id="periodVal">—</div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">mtd spend</div>
      <div class="stat-value" id="statSpend" style="color:var(--amber)">—</div>
      <div class="stat-sub" id="statSpendSub">— runs</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">requests</div>
      <div class="stat-value" id="statReqs">—</div>
      <div class="stat-sub">billable model calls</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">tokens</div>
      <div class="stat-value" id="statTok">—</div>
      <div class="stat-sub">prompt + completion</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">top model</div>
      <div class="stat-value mono" id="statTopModel">—</div>
      <div class="stat-sub" id="statTopModelSub">—</div>
    </div>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">cost by outcome</div>
        <div class="panel-sub" id="outcomeSub">— runs</div>
      </div>
      <div class="outcome-bar">
        <div class="ob-succ" id="obSucc" style="width:0%"></div>
        <div class="ob-fail" id="obFail" style="width:0%"></div>
      </div>
      <div id="outcomeRows"></div>
      <div class="outcome-insight" id="outcomeInsight" style="display:none">
        <span style="color:var(--red)">●</span>
        <span id="insightText"></span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">spend by model</div>
        <div class="panel-sub">sorted by cost</div>
      </div>
      <div id="modelRows"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">run ledger</div>
      <div class="panel-sub">most recent first</div>
    </div>
    <div class="filter-row" id="filterRow"></div>
    <table>
      <thead>
        <tr>
          <th>intent</th>
          <th style="width:120px">model</th>
          <th style="width:90px">status</th>
          <th class="r" style="width:60px">steps</th>
          <th class="r" style="width:100px">tokens</th>
          <th class="r" style="width:100px">cost</th>
          <th class="r" style="width:80px">when</th>
        </tr>
      </thead>
      <tbody id="runTable"></tbody>
    </table>
  </div>

</div>

<script>
'use strict';

let allRuns = [];
let filter  = 'all';

function fmtCost(n, d=6) { return n == null ? '—' : '$' + n.toFixed(d); }
function fmtNum(n)  { return n == null ? '—' : n.toLocaleString('en-US'); }
function fmtAge(ts) {
  const s = (Date.now() / 1000) - ts;
  if (s < 120)  return 'just now';
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

function topModel(byModel) {
  if (!byModel || !Object.keys(byModel).length) return null;
  return Object.entries(byModel).sort((a,b)=>b[1].estimated_cost_usd-a[1].estimated_cost_usd)[0];
}

function pillHtml(status) {
  const map = {
    succeeded: { color: '#84cc16', label: 'succeeded' },
    failed:    { color: '#dc2626', label: 'failed' },
    running:   { color: '#d97706', label: 'running' },
    cancelled: { color: '#7a756c', label: 'cancelled' },
    pending:   { color: '#7a756c', label: 'pending' },
  };
  const s = map[status] || { color: '#7a756c', label: status };
  return `<span class="pill" style="color:${s.color}">
    <span class="pill-dot" style="background:${s.color}"></span>${s.label}</span>`;
}

function render(data) {
  const s = data.summary;
  const runs = data.runs || [];
  allRuns = runs;

  // Period row
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('periodVal').innerHTML =
    `<span style="font-family:var(--mono);font-size:14px">${months[m]} 1 — ${months[m]} ${now.getDate()}, ${y}</span>
     <span class="period-sub">· ${runs.length} runs this period</span>`;

  // Stat cards
  document.getElementById('statSpend').textContent = fmtCost(s.estimated_cost_usd, 2);
  document.getElementById('statSpendSub').textContent = `${runs.length} runs`;
  document.getElementById('statReqs').textContent = fmtNum(s.request_count);
  document.getElementById('statTok').textContent = fmtNum(s.total_tokens);
  const top = topModel(s.by_model);
  if (top) {
    document.getElementById('statTopModel').textContent = top[0];
    document.getElementById('statTopModelSub').textContent =
      `${fmtCost(top[1].estimated_cost_usd, 2)} · ${top[1].request_count} req`;
  }

  // Outcome panel
  const done = runs.filter(r => r.status === 'succeeded' || r.status === 'failed');
  const succ = runs.filter(r => r.status === 'succeeded');
  const fail = runs.filter(r => r.status === 'failed');
  const succCost = succ.reduce((a,r)=>a+(r.usage?.estimated_cost_usd||0), 0);
  const failCost = fail.reduce((a,r)=>a+(r.usage?.estimated_cost_usd||0), 0);
  const totalCost = succCost + failCost;
  const succPct = totalCost > 0 ? (succCost / totalCost * 100) : 0;
  const failPct = totalCost > 0 ? (failCost / totalCost * 100) : 0;

  document.getElementById('outcomeSub').textContent = `${runs.length} runs`;
  document.getElementById('obSucc').style.width = succPct + '%';
  document.getElementById('obFail').style.width = failPct + '%';

  const succAvg = succ.length > 0 ? succCost / succ.length : 0;
  const failAvg = fail.length > 0 ? failCost / fail.length : 0;

  document.getElementById('outcomeRows').innerHTML = [
    outcomeRowHtml('succeeded', succ.length, succCost, succAvg, '#84cc16'),
    outcomeRowHtml('failed',    fail.length, failCost, failAvg, '#dc2626'),
  ].join('');

  if (succ.length > 0 && fail.length > 0) {
    const ratio = (failAvg / succAvg).toFixed(1);
    document.getElementById('insightText').innerHTML =
      `failed runs cost <span style="color:var(--text);font-family:var(--mono)">${ratio}×</span> successful runs on average`;
    document.getElementById('outcomeInsight').style.display = '';
  }

  // Model spend panel
  const byModel = s.by_model || {};
  const models = Object.entries(byModel).sort((a,b)=>b[1].estimated_cost_usd-a[1].estimated_cost_usd);
  const maxCost = models.length > 0 ? models[0][1].estimated_cost_usd : 1;
  document.getElementById('modelRows').innerHTML = models.map(([name, ms]) => {
    const pct = maxCost > 0 ? (ms.estimated_cost_usd / maxCost * 100) : 0;
    const tok  = ms.total_tokens >= 1e6 ? `${(ms.total_tokens/1e6).toFixed(2)}M` : fmtNum(ms.total_tokens);
    return `<div class="model-row">
      <div class="model-head">
        <div class="model-name">${esc(name)}</div>
        <div class="model-cost">${fmtCost(ms.estimated_cost_usd, 2)}</div>
      </div>
      <div class="model-bar-wrap">
        <div class="model-bar-track"><div class="model-bar-fill" style="width:${pct}%"></div></div>
        <div class="model-meta">${ms.request_count} req · ${tok} tok</div>
      </div>
    </div>`;
  }).join('');

  renderFilter();
}

function outcomeRowHtml(label, count, cost, avg, color) {
  return `<div class="outcome-row">
    <div class="or-left">
      <div class="or-dot" style="background:${color}"></div>
      <span class="or-label">${label}</span>
      <span class="or-count">${count}</span>
    </div>
    <div class="or-right">
      <span class="or-avg">avg ${fmtCost(avg, 4)}</span>
      <span class="or-total" style="color:var(--text)">${fmtCost(cost, 2)}</span>
    </div>
  </div>`;
}

function renderFilter() {
  const counts = { all: allRuns.length };
  allRuns.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
  const opts = [
    ['all', `all ${counts.all}`],
    ['succeeded', `succeeded ${counts.succeeded || 0}`],
    ['failed', `failed ${counts.failed || 0}`],
  ];
  document.getElementById('filterRow').innerHTML = opts.map(([k, lbl]) =>
    `<button class="filter-btn${filter === k ? ' active' : ''}" onclick="setFilter('${k}')">${lbl}</button>`
  ).join('');
  renderTable();
}

function setFilter(f) { filter = f; renderFilter(); }

function renderTable() {
  const rows = filter === 'all' ? allRuns : allRuns.filter(r => r.status === filter);
  document.getElementById('runTable').innerHTML = rows.map(r => {
    const cost    = r.usage?.estimated_cost_usd;
    const tokens  = r.usage?.total_tokens;
    const byM = r.usage?.by_model || {};
    const model = Object.keys(byM).length > 0 ? Object.keys(byM).sort((a,b)=>(byM[b].estimated_cost_usd||0)-(byM[a].estimated_cost_usd||0))[0] : '—';
    const costCol = r.status === 'failed' ? 'var(--red)' : 'var(--amber)';
    return `<tr onclick="location.href='/command-center/${esc(r.run_id)}'">
      <td style="padding-right:16px">
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          <span class="run-id-chip">${esc(r.run_id.slice(0,8))}</span>
          <span class="run-intent" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.intent||'—')}</span>
        </div>
      </td>
      <td style="color:var(--neutral)">${esc(model)}</td>
      <td>${pillHtml(r.status)}</td>
      <td class="r" style="color:var(--neutral);font-variant-numeric:tabular-nums">${r.step_count ?? '—'}</td>
      <td class="r" style="color:var(--neutral);font-variant-numeric:tabular-nums">${fmtNum(tokens)}</td>
      <td class="r" style="color:${costCol};font-variant-numeric:tabular-nums;font-weight:500">${fmtCost(cost, 4)}</td>
      <td class="r" style="color:var(--muted)">${fmtAge(r.updated_at)}</td>
    </tr>`;
  }).join('');
}

function esc(v) {
  if (v == null) return '';
  const d = document.createElement('div'); d.textContent = String(v); return d.innerHTML;
}

async function load() {
  try {
    const r = await fetch('/observer/api/usage?limit=100');
    if (r.ok) render(await r.json());
  } catch (_) {}
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
